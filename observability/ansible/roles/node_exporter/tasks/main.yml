---
- name: Create Node Exporter deployment directory
  ansible.builtin.file:
    path: /opt/exporters/node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Node Exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install bounded Node Exporter Compose model
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/exporters/node-exporter/compose.yaml
    owner: root
    group: root
    mode: "0644"

- name: Deploy Node Exporter
  community.docker.docker_compose_v2:
    project_src: /opt/exporters/node-exporter
    state: present
    wait: true
    wait_timeout: 120

- name: Allow Node Exporter only from observability
  community.general.ufw:
    rule: allow
    proto: tcp
    src: "{{ firewall_observability_ip }}"
    port: "9100"
    comment: Prometheus Node Exporter

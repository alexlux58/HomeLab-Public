---
- name: Harden the central observability virtual machine
  hosts: observability_servers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  # Phase 3: every live stage is gated. Extra vars override these defaults.
  vars:
    observability_allow_bootstrap: false
    observability_bootstrap_confirmation: ""
  pre_tasks:
    - name: Require this stage's approval and its exact confirmation
      ansible.builtin.assert:
        that:
          - observability_allow_bootstrap | bool
          - observability_bootstrap_confirmation == ('BOOTSTRAP ' ~ inventory_hostname)
        fail_msg: "Set observability_allow_bootstrap=true and observability_bootstrap_confirmation to the exact string in this playbook."
        quiet: true
  roles:
    - role: common
    - role: firewall
  post_tasks:
    - name: Read effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: bootstrap_sshd_effective
      changed_when: false

    - name: Verify effective SSH restrictions
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in bootstrap_sshd_effective.stdout"
          - "'passwordauthentication no' in bootstrap_sshd_effective.stdout"
          - "'kbdinteractiveauthentication no' in bootstrap_sshd_effective.stdout"
          - "'x11forwarding no' in bootstrap_sshd_effective.stdout"
          - "'allowagentforwarding no' in bootstrap_sshd_effective.stdout"
          - "'allowtcpforwarding local' in bootstrap_sshd_effective.stdout"
          - "'maxauthtries 3' in bootstrap_sshd_effective.stdout"

    - name: Read firewall status
      ansible.builtin.command: /usr/sbin/ufw status verbose
      register: bootstrap_ufw_status
      changed_when: false

    - name: Verify firewall is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in bootstrap_ufw_status.stdout"
          - "'22/tcp' in bootstrap_ufw_status.stdout"
          - "'192.168.0.0/24' in bootstrap_ufw_status.stdout"

    - name: Read active swap devices
      ansible.builtin.command:
        argv:
          - /usr/sbin/swapon
          - --show
          - --noheadings
          - --output
          - NAME,SIZE
      register: bootstrap_swap_status
      changed_when: false

    - name: Verify emergency swap is active
      ansible.builtin.assert:
        that:
          - "'/swapfile' in bootstrap_swap_status.stdout"

    - name: Read enabled service safeguards
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - qemu-guest-agent.service
          - fstrim.timer
          - unattended-upgrades.service
      register: bootstrap_enabled_services
      changed_when: false

    - name: Verify service safeguards are enabled
      ansible.builtin.assert:
        that:
          - bootstrap_enabled_services.stdout_lines == ['static', 'enabled', 'enabled']

    - name: Read active service safeguards
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - qemu-guest-agent.service
          - fstrim.timer
          - unattended-upgrades.service
      register: bootstrap_active_services
      changed_when: false

    - name: Verify service safeguards are active
      ansible.builtin.assert:
        that:
          - bootstrap_active_services.stdout_lines | unique == ['active']

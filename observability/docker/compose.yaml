---
name: homelab-observability

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *bounded-logging

services:
  prometheus:
    <<: *default-security
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      - --web.enable-admin-api
      # media-vm pushes through Alloy (ADR-0006); UFW keeps 9090 LAN-only.
      - --web.enable-remote-write-receiver
    ports:
      - ${OBSERVABILITY_IP:-192.168.0.31}:9090:9090
    volumes:
      - ../config/prometheus:/etc/prometheus:ro
      - /srv/observability/prometheus:/prometheus
    mem_limit: 900m
    cpus: 1.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      - alertmanager

  alertmanager:
    <<: *default-security
    image: prom/alertmanager:v0.32.1
    # Local Compose bind-mounts file-backed secrets without translating their
    # root:root 0600 ownership. Run this isolated container as root so the host
    # secret remains private; drop every capability and make its rootfs read-only.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    ports:
      - ${OBSERVABILITY_IP:-192.168.0.31}:9093:9093
    volumes:
      - ../config/alertmanager:/etc/alertmanager:ro
      - /srv/observability/alertmanager:/alertmanager
    secrets:
      - smtp_password
    mem_limit: 160m
    cpus: 0.25

  loki:
    <<: *default-security
    image: grafana/loki:3.7.4
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - ${OBSERVABILITY_IP:-192.168.0.31}:3100:3100
    volumes:
      - ../config/loki:/etc/loki:ro
      - /srv/observability/loki:/loki
    mem_limit: 800m
    cpus: 1.0

  alloy:
    <<: *default-security
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - 127.0.0.1:12345:12345
      - ${OBSERVABILITY_IP:-192.168.0.31}:1514:1514/tcp
      - ${OBSERVABILITY_IP:-192.168.0.31}:1514:1514/udp
    volumes:
      - ../config/alloy/central.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /srv/observability/alloy:/var/lib/alloy
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      - loki

  grafana:
    <<: *default-security
    image: grafana/grafana:13.1.0
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.lab.example.com
      GF_LOG_MODE: console
    secrets:
      - grafana_admin_password
    ports:
      - ${OBSERVABILITY_IP:-192.168.0.31}:3000:3000
    volumes:
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /srv/observability/grafana:/var/lib/grafana
    mem_limit: 480m
    cpus: 0.75
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  node-exporter:
    <<: *default-security
    image: prom/node-exporter:v1.12.1
    pid: host
    volumes:
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    mem_limit: 96m
    cpus: 0.2

  cadvisor:
    <<: *default-security
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=false
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 224m
    cpus: 0.35

  blackbox-exporter:
    <<: *default-security
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    cap_add:
      - NET_RAW
    volumes:
      - ../config/blackbox:/etc/blackbox:ro
    mem_limit: 96m
    cpus: 0.2

  snmp-exporter:
    <<: *default-security
    image: prom/snmp-exporter:v0.30.1
    command: ["--config.file=/run/secrets/snmp.yml"]
    secrets:
      - source: snmp_config
        target: snmp.yml
    mem_limit: 128m
    cpus: 0.25

  pve-exporter:
    <<: *default-security
    image: prompve/prometheus-pve-exporter:3.9.0
    # The image defaults to an unprivileged UID, but local Compose bind-mounts
    # secrets without translating ownership. Keep the host secret root:root
    # 0600 and run only this isolated, unexposed container as root.
    user: "0:0"
    command: ["--config.file=/run/secrets/pve.yml"]
    secrets:
      - source: pve_config
        target: pve.yml
    mem_limit: 160m
    cpus: 0.25

secrets:
  grafana_admin_password:
    file: /etc/observability/secret-store/grafana_admin_password
  pve_config:
    file: /etc/observability/secret-store/pve.yml
  snmp_config:
    file: /etc/observability/secret-store/snmp.yml
  smtp_password:
    file: /etc/observability/secret-store/smtp_password

networks:
  default:
    name: observability

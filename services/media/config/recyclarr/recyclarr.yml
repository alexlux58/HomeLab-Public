# Recyclarr owns Radarr quality definitions, quality profiles and custom
# formats (ADR-0004); the OpenTofu root never declares them.
# The API key comes from /etc/media/secrets/recyclarr.env (RADARR_API_KEY).
# Before the first real sync, list the templates this Recyclarr version ships
# (`recyclarr config list templates`) and run `sync --preview`.
---
radarr:
  lux-radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web

---
name: lux-media
# media-vm containers. radarr and prowlarr are the live definitions
# recovered from the guest bootstrap (unchanged). Everything else was added in
# Phase 3 and is deployed by the arr_stack role under its gate.
# API keys are operator-installed env files under /etc/media/secrets (0600
# root); Docker reads them as root, so container users never need access.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
    ports:
      - "7878:7878"
    volumes:
      - /srv/radarr/config:/config
      - /mnt/media:/media
    tmpfs:
      - /run/radarr-temp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 512
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
    ports:
      - "9696:9696"
    volumes:
      - /srv/prowlarr/config:/config
    tmpfs:
      - /run/prowlarr-temp:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    mem_limit: 768m
    mem_reservation: 192m
    cpus: 0.75
    pids_limit: 384

  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-radarr
    restart: unless-stopped
    command: ["radarr"]
    environment:
      PORT: "9707"
      URL: http://radarr:7878
    env_file:
      - /etc/media/secrets/exportarr-radarr.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    depends_on:
      - radarr
  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: exportarr-prowlarr
    restart: unless-stopped
    command: ["prowlarr"]
    environment:
      PORT: "9708"
      URL: http://prowlarr:9696
    env_file:
      - /etc/media/secrets/exportarr-prowlarr.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    depends_on:
      - prowlarr
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
  alloy:
    # Pushes to Prometheus on VM 310 (ADR-0006); nothing is published inbound.
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - /srv/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /srv/alloy/data:/var/lib/alloy/data
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 128
    depends_on:
      - exportarr-radarr
      - exportarr-prowlarr
      - node-exporter

  recyclarr:
    # On demand only (`docker compose --profile recyclarr run --rm recyclarr
    # sync --preview`), from the arr_stack role. Owns quality profiles and
    # custom formats (ADR-0004).
    image: ghcr.io/recyclarr/recyclarr:8@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
    profiles: ["recyclarr"]
    user: "1000:1000"
    environment:
      TZ: America/Los_Angeles
    env_file:
      - /etc/media/secrets/recyclarr.env
    volumes:
      - /srv/recyclarr/config:/config
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - radarr

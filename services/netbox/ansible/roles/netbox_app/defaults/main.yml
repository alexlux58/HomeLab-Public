---
netbox_app_assets_root: "{{ role_path }}/../../../config/templates/stage-a"
netbox_app_compose_root: /opt/netbox/compose
netbox_app_state_root: /srv/netbox
netbox_app_secrets_root: /etc/netbox/secrets

# NetBox is reached across the LAN by Nginx Proxy Manager on VM 300, so the
# published port binds to this guest's address and UFW admits only VM 300.
netbox_app_bind_address: 192.168.0.50
netbox_app_proxy_source: 192.168.0.30

# Image pins. Confirm the current upstream release and its digest at stage time
# and record the chosen values here before the first deployment; a wrong tag
# fails the pull loudly rather than deploying something unreviewed.
# v4.6.8 was the current stable release when VM 330 was first deployed.
netbox_app_image: docker.io/netboxcommunity/netbox:v4.6.8
netbox_app_postgres_image: docker.io/library/postgres:17-alpine
netbox_app_redis_image: docker.io/library/redis:7-alpine

# Operator-installed root-owned mode-0600 runtime secrets. Nothing here is
# generated by Ansible, and no value is ever read, logged, or committed.
netbox_app_required_secrets:
  - netbox.env
  - netbox-postgres.env

netbox_app_state_directories:
  # postgres:17-alpine runs as UID/GID 70, not the Debian postgres 999.
  - {path: postgres, owner: "70", group: "70"}
  - {path: redis-tasks, owner: "999", group: "999"}
  - {path: media, owner: "1000", group: "1000"}
  - {path: reports, owner: "1000", group: "1000"}
  - {path: scripts, owner: "1000", group: "1000"}

netbox_app_expected_containers:
  - netbox
  - netbox-housekeeping
  - netbox-postgres
  - netbox-redis-cache
  - netbox-redis-tasks
  - netbox-worker

# The first deployment initializes a PostgreSQL cluster and runs schema
# migrations. That is not reversible by re-running the play, so it is gated.
netbox_app_allow_first_deployment: false
netbox_app_first_deployment_confirmation: ""
netbox_app_first_deployment_confirmation_expected: >-
  DEPLOY NETBOX ON VM 330

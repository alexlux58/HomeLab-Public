---
- name: Reconcile NetBox guest base configuration
  hosts: netbox_guests
  gather_facts: true
  become: true
  serial: 1
  any_errors_fatal: true
  # Phase 3: every live stage is gated. Extra vars override these defaults.
  vars:
    netbox_allow_guest_config: false
    netbox_guest_config_confirmation: ""
  pre_tasks:
    - name: Require this stage's approval and its exact confirmation
      ansible.builtin.assert:
        that:
          - netbox_allow_guest_config | bool
          - netbox_guest_config_confirmation == ('CONFIGURE GUEST ' ~ inventory_hostname)
        fail_msg: "Set netbox_allow_guest_config=true and netbox_guest_config_confirmation to the exact string in this playbook."
        quiet: true

  roles:
    - role: homelab_guest_base

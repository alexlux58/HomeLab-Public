---
- name: Deploy the NetBox application
  hosts: netbox_guests
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  # Phase 3: every live stage is gated. Extra vars override these defaults.
  vars:
    netbox_allow_deploy: false
    netbox_deploy_confirmation: ""
  pre_tasks:
    - name: Require this stage's approval and its exact confirmation
      ansible.builtin.assert:
        that:
          - netbox_allow_deploy | bool
          - netbox_deploy_confirmation == ('DEPLOY NETBOX ON ' ~ inventory_hostname)
        fail_msg: "Set netbox_allow_deploy=true and netbox_deploy_confirmation to the exact string in this playbook."
        quiet: true

  roles:
    - role: netbox_app

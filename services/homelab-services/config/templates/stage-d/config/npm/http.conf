# Declarative HTTPS proxy hosts for the private homelab zone.
# Docker's embedded resolver permits services to be restarted independently.

map $host $homelab_upstream {
    home.lab.example.com http://homepage:3000;
    status.lab.example.com http://uptime-kuma:3001;
    tools.lab.example.com http://it-tools:80;
    netknife.lab.example.com http://netknife-web:8080;
    links.lab.example.com http://linkding:9090;
    drop.lab.example.com http://pairdrop:3000;
    speed.lab.example.com http://speedtest-tracker:80;
    grafana.lab.example.com http://192.168.0.31:3000;
    prometheus.lab.example.com http://192.168.0.31:9090;
    alert.lab.example.com http://192.168.0.31:9093;
    netbox.lab.example.com http://192.168.0.50:8000;
    ipam.lab.example.com http://192.168.0.50:8000;
    bao.lab.example.com http://192.168.0.40:8200;
}

map $http_upgrade $homelab_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name
        home.lab.example.com
        status.lab.example.com
        tools.lab.example.com
        netknife.lab.example.com
        links.lab.example.com
        drop.lab.example.com
        speed.lab.example.com
        grafana.lab.example.com
        prometheus.lab.example.com
        alert.lab.example.com
        netbox.lab.example.com
        ipam.lab.example.com
        bao.lab.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name
        home.lab.example.com
        status.lab.example.com
        tools.lab.example.com
        netknife.lab.example.com
        links.lab.example.com
        drop.lab.example.com
        speed.lab.example.com
        grafana.lab.example.com
        prometheus.lab.example.com
        alert.lab.example.com
        netbox.lab.example.com
        ipam.lab.example.com
        bao.lab.example.com;

    ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;
    ssl_session_cache shared:homelab_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass $homelab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $homelab_connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# VM 300 homelab-services stages.
#
# These playbooks ran under the Proxmox migration's ansible.cfg before the
# Phase 1 monorepo split, and keep its safety settings:
#   * host_key_checking is TRUE and is never overridden.
#   * BatchMode + publickey only: never fall back to a password prompt.
#   * gathering is explicit so no play reuses cached facts.
# Relative paths resolve from this file's directory.
# ---------------------------------------------------------------------------
[defaults]
inventory              = ../../../inventory/homelab-services.yml
roles_path             = roles
collections_path       = collections:../../../platform/proxmox/ansible/collections
stdout_callback        = default
result_format          = yaml
interpreter_python     = /usr/bin/python3
host_key_checking      = True
retry_files_enabled    = False
gathering              = explicit
forks                  = 3
timeout                = 60

[inventory]
unparsed_is_failed = True

[ssh_connection]
ssh_args        = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining      = True
retries         = 0

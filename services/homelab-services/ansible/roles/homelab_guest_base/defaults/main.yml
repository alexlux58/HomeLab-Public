---
# role_path, not playbook_dir: NetBox's playbook also runs this role.
homelab_guest_base_assets_root: "{{ role_path }}/../../../config/templates"

# AllowUsers for the hardened sshd drop-in. This role is shared across guests
# whose administrative account is not named the same; writing a literal name
# here locks the guest out on the SSH restart. Override per host group.
homelab_guest_base_ssh_allow_users:
  - labuser

homelab_guest_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - iptables
  - jq
  - qemu-guest-agent
  - sqlite3
  - unattended-upgrades
  - zstd
homelab_guest_base_docker_packages:
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin

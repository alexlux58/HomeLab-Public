---
- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

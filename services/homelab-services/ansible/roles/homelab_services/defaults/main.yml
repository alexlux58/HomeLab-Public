---
homelab_services_service_name: ""
homelab_services_valid_services:
  - homepage
  - it-tools
  - linkding
  - netknife
  - npm
  - pairdrop
  - speedtest-tracker
  - uptime-kuma

homelab_services_assets_root: "{{ role_path }}/../../../config/templates/stage-d"
homelab_services_compose_root: /opt/homelab/compose
homelab_services_state_root: /srv/homelab
homelab_services_secrets_root: /etc/homelab/secret-store
homelab_services_netknife_source: /opt/homelab/apps/netknife
homelab_services_controller_netknife_source: ""
homelab_services_allow_npm_route_ownership: false
homelab_services_npm_route_confirmation: ""
homelab_services_npm_route_confirmation_expected: >-
  REPLACE NPM UI PROXY HOSTS WITH DECLARATIVE HOME LAB ROUTES

homelab_services_required_secrets:
  netknife:
    - netknife.env
  speedtest-tracker:
    - speedtest-tracker.env

homelab_services_state_directories:
  homepage:
    - {path: homepage/config, owner: "1000", group: "1000"}
  it-tools: []
  linkding:
    - {path: linkding/data, owner: "1000", group: "1000"}
  netknife: []
  npm:
    - {path: npm/data, owner: root, group: root}
    - {path: npm/letsencrypt, owner: root, group: root}
  pairdrop: []
  speedtest-tracker:
    - {path: speedtest-tracker/config, owner: "1000", group: "1000"}
  uptime-kuma:
    - {path: uptime-kuma/data, owner: "1000", group: "1000"}

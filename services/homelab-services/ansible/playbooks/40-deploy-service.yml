---
- name: Deploy exactly one reviewed Home Lab application
  hosts: homelab_service_guests
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  # Phase 3: every live stage is gated. Extra vars override these defaults.
  vars:
    homelab_allow_service_deploy: false
    homelab_service_deploy_confirmation: ""
  pre_tasks:
    - name: Require this stage's approval and its exact confirmation
      ansible.builtin.assert:
        that:
          - homelab_allow_service_deploy | bool
          - homelab_service_deploy_confirmation == ('DEPLOY ' ~ homelab_services_service_name ~ ' ON ' ~ inventory_hostname)
        fail_msg: "Set homelab_allow_service_deploy=true and homelab_service_deploy_confirmation to the exact string in this playbook."
        quiet: true

  roles:
    - role: homelab_services

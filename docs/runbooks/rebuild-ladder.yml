---
# Rebuild-from-zero ladder, L0 -> L8. Source of truth for
# docs/runbooks/rebuild-from-zero.md and `make rebuild-plan`.
#
# Every step runs exactly one Make target (or is a manual step). Nothing chains
# steps: the operator climbs one rung at a time and runs `verify` before the
# next. `gate` is either {flag, confirmation} (passed in EXTRA_JSON), or a
# `kind` of read-only / local / manual with a reason. Durations are estimates.
# Guest names in confirmations are inventory hostnames.
rungs:
  - id: L0
    title: Bare metal and base installs
    steps:
      - id: l0-proxmox-answer-files
        component: platform/proxmox
        make: rebuild-l0-answer-files NODE=<node> WRITE=1
        gate: {kind: local, reason: "Writes git-ignored files only; secrets come from the operator's environment"}
        inputs: ["lab.yml nodes.<node>.install.{fqdn,disk_filter,interface_filter}", PVE_ROOT_PASSWORD_HASH, PVE_ROOT_SSH_KEYS_FILE, PVE_MAILTO]
        duration: 5 min
        verify: proxmox-auto-install-assistant validate-answer artifacts/autoinstall/<node>.toml
        rollback: Discard the generated file; nothing outside the controller changed.
      - id: l0-proxmox-install
        manual: true
        gate: {kind: manual, reason: "ISO preparation and console install are operator steps by design"}
        inputs: [PVE 9 ISO, answer file from l0-proxmox-answer-files]
        duration: 30 min per node
        verify: "Compare the console host-key fingerprint with lab.yml nodes.<node>.host_fingerprint, then `ssh <alias> pveversion`"
        rollback: Reinstall the node; no guest exists yet.
        steps: >-
          proxmox-auto-install-assistant prepare-iso <pve.iso> --fetch-from iso
          --answer-file <node>.toml; boot the node from it; pin the host key
          after verifying it at the console.
      - id: l0-nas
        manual: true
        gate: {kind: manual, reason: "DSM has no provider; NAS admin credentials are the operator's"}
        inputs: [DSM configuration backup, lab.yml nas]
        duration: 2 h plus RAID resync
        verify: "`ssh nas` succeeds with the pinned key; shares proxmox-cluster-backups, Media and media-backups exist"
        rollback: Restore the DSM configuration backup.
        steps: >-
          Restore DSM, recreate shares (proxmox-cluster-backups on Volume 1,
          Media and media-backups on Volume 2), the plex-reader and
          media-backup accounts, NFS export for the cluster, and the
          split-horizon DNS zone from lab.yml dns_records.
      - id: l0-workstation
        manual: true
        gate: {kind: manual, reason: "workstation stays Windows and is never wiped by automation"}
        inputs: [Operator's own Windows backup]
        duration: operator-dependent
        verify: "`ssh workstation hostname` returns workstation"
        rollback: Not applicable; nothing in this repository changes Windows.
        steps: >-
          Restore Windows from the operator's backup, then install VirtualBox,
          Plex Media Server and qBittorrent. Plex claim and the client-scoped
          firewall rule stay attended (L5).
      - id: l0-media-guest
        manual: true
        gate: {kind: manual, reason: "VirtualBox lifecycle on workstation is attended"}
        inputs: [services/media/config/cloud-init/user-data.yml.tmpl, admin public key]
        duration: 30 min
        verify: make -C services/media preflight
        rollback: Delete only the new VM; the retained media-vm disks are never touched.
        steps: >-
          Create a 2 vCPU / 4 GiB VM with a 50 GiB data disk, NAT with a
          loopback-only SSH forward, fill the cloud-init template, build the
          seed with cloud-localds, attach it and boot.

  - id: L1
    title: Host configuration
    steps:
      - id: l1-nfs-storage
        component: platform/proxmox
        make: nas-preflight
        gate: {flag: allow_configure_nfs_storage, confirmation: null, gap: "Flag-only gate predates Phase 3; add a confirmation string"}
        inputs: [NAS NFS export for the cluster]
        duration: 10 min
        verify: "pvesh get /nodes/<node>/storage/synology-backup/status on each node shows active"
        rollback: pvesm remove synology-backup (removes the storage definition only, never archives).
      - id: l1-host-config
        component: platform/proxmox
        make: rebuild-l1-host-config
        gate: {flag: pve_host_config_allow, confirmation: "L1 CONFIGURE pve pve1 pve2"}
        inputs: [inventory/lab.yml backup_jobs and guest onboot/startup]
        duration: 5 min
        verify: "pvesh get /cluster/backup lists every lab.yml backup job"
        rollback: Disable a created job in the UI (never delete archives); qm set <vmid> --onboot 0.

  - id: L2
    title: Cluster
    steps:
      - id: l2-create-cluster
        component: platform/proxmox
        make: create-cluster
        gate: {flag: allow_create_cluster, confirmation: "CREATE CLUSTER homelab ON pve1 192.168.0.11"}
        inputs: [three nodes installed and configured]
        duration: 10 min
        verify: "pvecm status on pve1 shows one node, quorate"
        rollback: Reinstall pve1 (no guests exist yet).
      - id: l2-join-pve3
        component: platform/proxmox
        make: join-pve3
        gate: {flag: allow_join_pve3, confirmation: "JOIN pve3 192.168.0.13 TO homelab"}
        inputs: [root password prompt answered at the console (pvecm add is manual)]
        duration: 15 min
        verify: "pvecm status shows two nodes, quorate"
        rollback: Reinstall pve3 and rejoin.
      - id: l2-join-pve2
        component: platform/proxmox
        make: join-pve2
        gate: {flag: allow_join_pve2, confirmation: "JOIN pve2 192.168.0.12 TO homelab"}
        inputs: [root password prompt answered at the console]
        duration: 15 min
        verify: "pvecm status shows three nodes, three votes, quorate"
        rollback: Reinstall pve2 and rejoin.

  - id: L3
    title: Guests
    steps:
      - id: l3-state-backend
        manual: true
        gate: {kind: manual, reason: "State migration is the operator's (ADR-0003); agents never migrate state"}
        inputs: [D:/homelab-state mounted in devcontainer, encrypted NAS state copy or archived plaintext source, per-root TF_VAR_state_passphrase]
        duration: 30 min per root
        verify: tofu plan shows no changes after migration
        rollback: Keep using the archived local state; delete nothing until the plan is clean.
        steps: Follow docs/runbooks/state-migration.md in order (OpenBao, NetBox, homelab-guests import-first). Restore encrypted NAS state or re-adopt by import; require a no-change plan before any apply.
      - id: l3-guests-plan
        component: platform/proxmox
        make: rebuild-guests-plan REBUILD_VARS='-var-file=rebuild.tfvars'
        gate: {flag: rebuild_guests, confirmation: "REBUILD <sorted guest names> FROM ZERO"}
        inputs: [backend.hcl (ADR-0003), TF_VAR_proxmox_api_token, TF_VAR_state_passphrase, "git-ignored rebuild.tfvars with names, confirmation and public keys"]
        duration: 10 min
        verify: The saved plan creates only the named VMIDs with lab.yml MACs, off and protected.
        rollback: Discard the plan file.
      - id: l3-guests-apply
        manual: true
        gate: {kind: manual, reason: "There is no apply target; the operator applies the reviewed plan"}
        inputs: [rebuild.tfplan from l3-guests-plan]
        duration: 20 min
        verify: "qm list on each node shows the new VMIDs stopped; qm config shows protection: 1"
        rollback: Guests are protected and prevent_destroy is set; removing one is a separate attended decision.
        steps: tofu -chdir=platform/proxmox/terraform/rebuild-guests apply rebuild.tfplan
      - id: l3-eveng-restore
        manual: true
        gate: {kind: manual, reason: "Restores overwrite a VMID; attended by design"}
        inputs: [latest verified VM 290 archive on synology-backup]
        duration: 1 h
        verify: "qm config 290 matches the archive; boot with link_down on every NIC first"
        rollback: Leave the restored VM stopped and protected.
        steps: qmrestore <archive> 290 --storage local on pve1, then verify.

  - id: L4
    title: Guest base configuration
    steps:
      - id: l4-vm300-base
        component: platform/proxmox
        make: homelab-base
        gate: {flag: homelab_allow_guest_config, confirmation: "CONFIGURE GUEST homelab-services"}
        inputs: [VM 300 host key verified out of band through the guest agent]
        duration: 15 min
        verify: make -C platform/proxmox homelab-preflight
        rollback: Re-run with the previous commit's configuration.
      - id: l4-vm310-bootstrap
        component: observability
        make: bootstrap
        gate: {flag: observability_allow_bootstrap, confirmation: "BOOTSTRAP observability"}
        inputs: [VM 310 host key verified out of band]
        duration: 15 min
        verify: make -C observability preflight
        rollback: Re-run with the previous commit's configuration.
      - id: l4-vm330-base
        component: platform/proxmox
        make: netbox-base
        gate: {flag: netbox_allow_guest_config, confirmation: "CONFIGURE GUEST netbox"}
        inputs: [VM 330 host key verified out of band]
        duration: 15 min
        verify: make -C platform/proxmox netbox-preflight
        rollback: Re-run with the previous commit's configuration.
      - id: l4-openbao-hosts
        component: security/secrets-openbao
        make: prepare-hosts
        gate: {flag: allow_prepare_openbao_hosts, confirmation: "PREPARE OPENBAO HOSTS 320 321 322"}
        inputs: [VMs 320-322 host keys verified out of band]
        duration: 20 min
        verify: make -C security/secrets-openbao preflight
        rollback: Re-run with the previous commit's configuration.
      - id: l4-media-host
        component: services/media
        make: configure-host
        gate: {flag: media_host_allow, confirmation: "MEDIA HOST media-vm"}
        inputs: [/etc/media/secrets/cifs.cred installed root:root 0600]
        duration: 10 min
        verify: make -C services/media preflight
        rollback: Unmount the shares; packages and directories are harmless to leave.

  - id: L5
    title: Applications and their configuration
    steps:
      - id: l5-vm300-apps
        component: platform/proxmox
        make: homelab-service SERVICE=<app>
        gate: {flag: homelab_allow_service_deploy, confirmation: "DEPLOY <app> ON homelab-services"}
        inputs: [/etc/homelab/secret-store/* for the app, one app per run]
        duration: 10 min per app
        verify: Homepage card for the app turns green; uptime_kuma_monitors.py reports no drift
        rollback: Re-deploy the app from the previous commit.
      - id: l5-npm-routes
        component: platform/proxmox
        make: homelab-service SERVICE=npm
        gate: {flag: homelab_services_allow_npm_route_ownership, confirmation: "REPLACE NPM UI PROXY HOSTS WITH DECLARATIVE HOME LAB ROUTES"}
        inputs: [wildcard certificate DNS-01 credential]
        duration: 15 min
        verify: every lab.yml proxied site answers over HTTPS
        rollback: Restore NPM data from the L6 application backup.
      - id: l5-dns-records
        manual: true
        gate: {kind: manual, reason: "Synology DNS has no provider"}
        inputs: [lab.yml dns_records]
        duration: 20 min
        verify: dig @192.168.0.20 <site>.lab.example.com returns 192.168.0.30
        rollback: Revert the record in DSM.
        steps: Create the A records in lab.yml dns_records in Synology DNS Server.
      - id: l5-observability
        component: observability
        make: deploy
        gate: {flag: observability_allow_deploy, confirmation: "DEPLOY OBSERVABILITY STACK ON observability"}
        inputs: [/etc/observability/secret-store/* (L7 table)]
        duration: 20 min
        verify: make -C observability validate
        rollback: Restore the observability archive (L6).
      - id: l5-netbox
        component: platform/proxmox
        make: netbox-deploy
        gate: {flag: netbox_allow_deploy, confirmation: "DEPLOY NETBOX ON netbox"}
        inputs: [NetBox secrets; on a first deployment also netbox_app_allow_first_deployment with "DEPLOY NETBOX ON VM 330"]
        duration: 20 min
        verify: make -C platform/proxmox netbox-preflight
        rollback: Restore the pg_dump backup (L6).
      - id: l5-netbox-seed
        manual: true
        gate: {kind: manual, reason: "Automation never writes to NetBox"}
        inputs: [lab.yml]
        duration: 15 min
        verify: NetBox lists every lab.yml node, guest and address
        rollback: Delete the imported objects in NetBox.
        steps: python services/netbox/scripts/netbox_seed_csv.py --out <dir>, then bulk import the three files in order.
      - id: l5-openbao-install
        component: security/secrets-openbao
        make: install-server
        gate: {flag: allow_install_openbao, confirmation: "INSTALL OPENBAO 2.6.1 WITHOUT INITIALIZING"}
        inputs: [signed OpenBao 2.6.1 binary]
        duration: 15 min
        verify: make -C security/secrets-openbao validate-uninitialized
        rollback: Stop and disable the service.
      - id: l5-openbao-tls
        component: security/secrets-openbao
        make: configure-tls
        gate: {flag: allow_configure_openbao_tls, confirmation: "DEPLOY OPENBAO TLS TO THREE NODES"}
        inputs: [operator-issued node certificates from the offline root]
        duration: 15 min
        verify: make -C security/secrets-openbao validate-uninitialized
        rollback: Re-deploy the previous certificates.
      - id: l5-openbao-ha
        component: security/secrets-openbao
        make: configure-ha
        gate: {flag: allow_configure_openbao_ha, confirmation: "CONFIGURE OPENBAO RAFT AND VIP UNINITIALIZED"}
        inputs: [VIP 192.168.0.40 reserved]
        duration: 15 min
        verify: make -C security/secrets-openbao validate-uninitialized  # must report initialized=false
        rollback: Stop Keepalived and HAProxy.
      - id: l5-media-arr
        component: services/media
        make: deploy-arr
        gate: {flag: arr_stack_allow, confirmation: "MEDIA DEPLOY media-vm"}
        inputs: [/etc/media/secrets/*.env installed root:root 0600]
        duration: 15 min
        verify: "Radarr and Prowlarr answer on workstation's loopback forwards; up{host=\"media-vm\"} appears in Prometheus"
        rollback: docker compose down in /opt/lux-media, then restore *arr backups (L6).
      - id: l5-media-arr-config
        component: services/media
        make: arr-plan
        gate: {kind: manual, reason: "Apply is manual after the plan is reviewed; no apply target exists"}
        inputs: [backend.hcl, TF_VAR_radarr_api_key, TF_VAR_prowlarr_api_key, TF_VAR_qbittorrent_*, TF_VAR_state_passphrase]
        duration: 10 min
        verify: The plan shows only the root folder, qBittorrent client, remote path mapping and Prowlarr link.
        rollback: Restore the Radarr/Prowlarr backup zip (L6).
      - id: l5-media-profiles
        component: services/media
        make: sync-quality-profiles
        gate: {flag: arr_stack_allow_recyclarr_sync, confirmation: "RECYCLARR SYNC media-vm"}
        inputs: [/etc/media/secrets/recyclarr.env]
        duration: 5 min
        verify: The preview (no gate) shows no changes after a real sync.
        rollback: Restore the Radarr backup zip (L6).
      - id: l5-plex
        manual: true
        gate: {kind: manual, reason: "Claim, client firewall rule and library apply are attended"}
        inputs: [Plex claim session, PLEX_TOKEN, first client IP]
        duration: 30 min
        verify: python services/media/scripts/plex_libraries.py  # plan shows no changes
        rollback: Remove the library in Plex; NAS media is untouched.
        steps: >-
          Claim Plex in the operator's browser, add the client-scoped firewall
          rule by hand, then run plex_libraries.py plan and, with
          PLEX_ALLOW_APPLY=true and PLEX_CONFIRMATION="PLEX LIBRARIES workstation", --apply.
      - id: l5-uptime-kuma
        manual: true
        gate: {kind: manual, reason: "Uptime Kuma 2 has no supported write API"}
        inputs: [services/homelab-services/config/uptime-kuma/monitors.yml]
        duration: 20 min
        verify: python services/homelab-services/scripts/uptime_kuma_monitors.py --dump <latest dump>
        rollback: Remove the monitor in the UI.
        steps: Create each monitor in monitors.yml in the Uptime Kuma UI.

  - id: L6
    title: Data restore (isolated first)
    steps:
      - id: l6-restore-drills
        manual: true
        gate: {kind: manual, reason: "Restores run only against an isolated VM or network, attended"}
        inputs: [docs/reference/backup-matrix.yml]
        duration: 1-4 h
        verify: Each backup-matrix row's verify command passes on the isolated copy.
        rollback: Discard the isolated copy; production was never touched.
        steps: Follow every row of docs/reference/backup-matrix.yml, one at a time.
      - id: l6-backup-pull
        component: platform/proxmox
        make: configure-backup-pull
        gate: {flag: allow_backup_pull, confirmation: "INSTALL BACKUP PULL ON <inventory-node> <address>"}
        inputs: [dedicated public key, least-loaded mounted node, verified host pins, D free space]
        duration: 10 min plus archive copy
        verify: Install the local task; size and SHA-256 match NAS before and after the first pull.
        rollback: Disable only this task and separately remove only its public key; retain every copy.
        steps: Follow platform/proxmox/docs/backup-pull.md; stop for the exact node confirmation.
      - id: l6-media-backups
        component: services/media
        make: configure-backup
        gate: {flag: media_backup_allow, confirmation: "MEDIA BACKUP media-vm"}
        inputs: [media-backups share mounted]
        duration: 5 min
        verify: systemctl list-timers arr-backup.timer on the guest
        rollback: systemctl disable --now arr-backup.timer (copies are kept).

  - id: L7
    title: Attended secrets and ceremonies
    steps:
      - id: l7-openbao-init
        manual: true
        gate: {kind: manual, reason: "bao operator init/unseal is an attended ceremony; never automated"}
        inputs: [five PGP recipients, threshold three]
        duration: 1 h
        verify: make -C security/secrets-openbao validate-post-init
        rollback: None automated; see security/secrets-openbao/docs/restore-runbook.md.
        steps: Run the ceremony by hand, then `make -C security/secrets-openbao configure-post-init` with its gate.
      - id: l7-operator-inputs
        manual: true
        gate: {kind: manual, reason: "Secrets are installed by the operator only"}
        inputs: [docs/reference/operator-inputs.md]
        duration: 1 h
        verify: Each stage's secret-file metadata check passes (root:root 0600).
        rollback: Rotate the affected credential.
        steps: Install or rotate each row of docs/reference/operator-inputs.md.

  - id: L8
    title: Validate and enable onboot
    steps:
      - id: l8-validate-cluster
        component: platform/proxmox
        make: validate
        gate: {kind: read-only, reason: "Validation only"}
        inputs: []
        duration: 10 min
        verify: The report shows every check passing.
        rollback: Not applicable.
      - id: l8-validate-observability
        component: observability
        make: validate
        gate: {kind: read-only, reason: "Validation only"}
        inputs: []
        duration: 5 min
        verify: make -C observability validate passes with changed=0.
        rollback: Not applicable.
      - id: l8-onboot
        component: platform/proxmox
        make: rebuild-l1-host-config
        gate: {flag: pve_host_config_allow, confirmation: "L1 CONFIGURE pve pve1 pve2"}
        inputs: [lab.yml onboot set to true only for guests whose L6 drill passed]
        duration: 5 min
        verify: A controlled node reboot brings the chosen guests back.
        rollback: Set onboot back to false in lab.yml and re-run.

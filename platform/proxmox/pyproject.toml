[project]
name = "proxmox-cluster-migration"
version = "1.0.0"
description = "Safe, gated migration of three standalone Proxmox VE hosts into one three-node cluster"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "collections", "artifacts", "host-configs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
  "RET504",  # explicit assignment before return aids readability in report code
  "C408",    # dict() calls are clearer in a few manifest builders
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]
# The remote collector is copied onto Proxmox hosts and executed there against
# whatever Python the host ships (3.11 on PVE 8, 3.13 on PVE 9). It is kept
# deliberately plain — os.path and %-formatting — so it is trivially readable by
# whoever has to audit what a script is doing on their hypervisor.
"roles/discovery/files/pve_discover.py" = ["PTH", "UP031", "UP022", "SIM108", "RUF059"]
# This generator embeds an HTML/CSS template. Reflowing markup and minified CSS
# to 100 columns would make it materially harder to read, not easier.
"scripts/build_lan_inventory_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
markers = [
  "repo: static safety checks over the repository itself",
]

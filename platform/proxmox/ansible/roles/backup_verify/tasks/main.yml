---
# Stage 4b. Verification is what turns "a file exists on the NAS" into "a backup
# exists". Nothing destructive is allowed to run until this role has passed.

- name: Stage the verification script
  ansible.builtin.copy:
    src: verify-archives.sh
    dest: "{{ backup_verify_remote_script }}"
    owner: root
    group: root
    mode: "0700"

- name: Read this host's manifest fragments
  ansible.builtin.find:
    paths: "{{ vzdump_backup_manifest_dir | default(remote_work_dir ~ '/manifests') }}"
    patterns:
      - "initial-*.json"
      - "final-*.json"
  register: backup_verify_fragments

- name: Assert manifests exist to verify against
  ansible.builtin.assert:
    that:
      - backup_verify_fragments.matched > 0
    fail_msg: >-
      No backup manifests found on {{ inventory_hostname }}. Run the backup
      stages before verifying.

- name: Require a manifest for every requested generation
  ansible.builtin.assert:
    that:
      - backup_verify_fragments.files | map(attribute='path') | map('basename')
        | select('match', '^' ~ item ~ '-') | list | length > 0
    fail_msg: >-
      No {{ item }} manifest exists on {{ inventory_hostname }}. Run that backup
      generation before requesting its verification.
  loop: "{{ backup_verify_generations }}"

- name: Load every manifest fragment
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ backup_verify_fragments.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: backup_verify_raw

- name: Parse the manifest fragments
  ansible.builtin.set_fact:
    backup_verify_entries: >-
      {{ backup_verify_raw.results | map(attribute='content') | map('b64decode') | map('from_json') | list }}

- name: Verify every archive (checksum + structural validation)
  ansible.builtin.command:
    argv: "{{ ['/bin/bash', backup_verify_remote_script] + (backup_verify_entries | map(attribute='archive_path') | list) }}"
  changed_when: false
  register: backup_verify_run
  async: "{{ backup_verify_timeout_seconds }}"
  poll: 30

- name: Parse the verification results
  ansible.builtin.set_fact:
    backup_verify_results: >-
      {{ backup_verify_run.stdout_lines | map('from_json') | list }}

- name: Merge verification results back into the manifest entries
  ansible.builtin.set_fact:
    backup_verify_merged: "{{ backup_verify_merged | default([]) + [_merged_entry] }}"
  vars:
    # The archive path is the join key between the manifest fragment written at
    # backup time and the verification result produced just now.
    _result: >-
      {{ backup_verify_results
         | selectattr('archive_path', 'equalto', item.archive_path)
         | first | default({}) }}
    _merged_entry: >-
      {{ item | combine({
           'verification': {
             'ok': _result.ok | default(false),
             'method': _result.method | default('not-run'),
             'rc': _result.rc | default(1),
             'message': _result.message | default(''),
             'verified_at': ansible_date_time.iso8601
           },
           'sha256_reverified': _result.sha256 | default(''),
           'archive_size_bytes': _result.size_bytes | default(0),
           'timestamp': '%Y-%m-%dT%H:%M:%SZ'
             | strftime(_result.mtime_epoch | default(0) | int, utc=true)
         }) }}
  loop: "{{ backup_verify_entries }}"
  loop_control:
    label: "{{ item.original_vmid }} {{ item.generation }}"

- name: Assert every recomputed checksum matches the one recorded at backup time
  ansible.builtin.assert:
    that:
      - item.sha256 == item.sha256_reverified
    fail_msg: >-
      Checksum drift on {{ item.archive_path }}:
      recorded {{ item.sha256 }}, now {{ item.sha256_reverified }}.
      The archive changed after it was written — treat it as unusable.
  loop: "{{ backup_verify_merged }}"
  loop_control:
    label: "{{ item.original_vmid }}"

- name: Assert every archive verified successfully
  ansible.builtin.assert:
    that:
      - item.verification.ok | bool
    fail_msg: |
      VERIFICATION FAILED for VMID {{ item.original_vmid }} ({{ item.guest_name }}),
      generation {{ item.generation }}:
        archive: {{ item.archive_path }}
        method:  {{ item.verification.method }}
        rc:      {{ item.verification.rc }}
        output:  {{ item.verification.message }}
      Do not proceed. Re-run the backup for this guest.
  loop: "{{ backup_verify_merged }}"
  loop_control:
    label: "{{ item.original_vmid }} {{ item.generation }}"

- name: Write the verified manifest back to the host
  ansible.builtin.copy:
    content: "{{ backup_verify_merged | to_nice_json }}\n"
    dest: "{{ vzdump_backup_manifest_dir | default(remote_work_dir ~ '/manifests') }}/verified.json"
    owner: root
    group: root
    mode: "0600"

- name: Save the verified manifest on the controller
  ansible.builtin.copy:
    content: "{{ backup_verify_merged | to_nice_json }}\n"
    dest: "{{ artifacts_dir }}/backup-manifest-{{ expected_hostname }}.json"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Assert the verified count equals the protected guest count per generation
  ansible.builtin.assert:
    that:
      - (backup_verify_merged | selectattr('generation', 'equalto', item) | selectattr('verification.ok') | list | length)
        == (protected_guests[inventory_hostname] | length)
    fail_msg: >-
      Generation '{{ item }}' on {{ inventory_hostname }}:
      {{ backup_verify_merged | selectattr('generation', 'equalto', item) | selectattr('verification.ok') | list | length }}
      verified archives for {{ protected_guests[inventory_hostname] | length }} protected guests.
      These numbers must be equal.
    success_msg: >-
      Generation '{{ item }}': {{ protected_guests[inventory_hostname] | length }}/{{ protected_guests[inventory_hostname] | length }} verified.
  loop: "{{ backup_verify_generations }}"
  when: (backup_verify_merged | selectattr('generation', 'equalto', item) | list | length) > 0

- name: Remove the staged verification script
  ansible.builtin.file:
    path: "{{ backup_verify_remote_script }}"
    state: absent

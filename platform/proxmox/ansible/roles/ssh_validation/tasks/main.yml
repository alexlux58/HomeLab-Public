---
# Proves that the EXISTING key-based access works, and that the host on the other
# end of the connection is still the host we verified by hand. No key is ever
# generated, copied or installed here.

- name: Confirm connectivity over the existing SSH key
  ansible.builtin.ping:
  register: ssh_validation_ping

- name: Gather the minimum facts needed for validation
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "min"
      - "network"

- name: Read the reported hostname and Proxmox version
  ansible.builtin.command: "{{ item.cmd }}"
  changed_when: false
  register: ssh_validation_facts
  loop:
    - {name: hostname, cmd: hostname}
    - {name: fqdn, cmd: hostname -f}
    - {name: pveversion, cmd: pveversion}
  loop_control:
    label: "{{ item.name }}"

- name: Build a lookup of the collected values
  ansible.builtin.set_fact:
    ssh_validation_values: >-
      {{ dict(ssh_validation_facts.results
              | map(attribute='item.name') | zip(ssh_validation_facts.results
              | map(attribute='stdout') | map('trim'))) }}

- name: Assert the hostname is the one this inventory entry expects
  ansible.builtin.assert:
    that:
      - ssh_validation_values.hostname == expected_hostname
    fail_msg: >-
      Connected to {{ inventory_hostname }} ({{ ansible_host }}) but it reports
      hostname '{{ ssh_validation_values.hostname }}' instead of the expected
      '{{ expected_hostname }}'. Refusing to continue: either the inventory is
      wrong or you are talking to the wrong machine.
    success_msg: "{{ inventory_hostname }} reports hostname '{{ expected_hostname }}' as expected."

- name: Assert this is actually a Proxmox VE host
  ansible.builtin.assert:
    that:
      - "'pve-manager' in ssh_validation_values.pveversion"
    fail_msg: "{{ inventory_hostname }} does not look like a Proxmox VE host: {{ ssh_validation_values.pveversion }}"

- name: Read the host's Ed25519 public host key
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_validation_hostkey

- name: Compute the SHA-256 fingerprint of the host key (ssh-keygen, authoritative)
  ansible.builtin.command: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256
  changed_when: false
  register: ssh_validation_keygen

- name: Extract the fingerprint field
  ansible.builtin.set_fact:
    ssh_validation_fingerprint: "{{ ssh_validation_keygen.stdout.split()[1] }}"

- name: Report the observed fingerprint
  ansible.builtin.debug:
    msg:
      - "host:        {{ inventory_hostname }} ({{ ansible_host }})"
      - "hostname:    {{ ssh_validation_values.hostname }}"
      - "fqdn:        {{ ssh_validation_values.fqdn }}"
      - "pveversion:  {{ ssh_validation_values.pveversion }}"
      - "fingerprint: {{ ssh_validation_fingerprint }}"
      - "expected:    {{ expected_host_fingerprint | default('(none recorded)') }}"

- name: Assert the SSH host fingerprint still matches the operator-verified value
  ansible.builtin.assert:
    that:
      - ssh_validation_fingerprint == expected_host_fingerprint
    fail_msg: |
      SSH HOST KEY MISMATCH on {{ inventory_hostname }} ({{ ansible_host }}).

        expected: {{ expected_host_fingerprint | default('(none recorded)') }}
        observed: {{ ssh_validation_fingerprint }}

      This is EXPECTED after a clean installation, and is a red flag at any other
      time. Nothing is accepted automatically. Follow docs/reinstall-ssh-recovery.md:
        1. At the host's physical/IPMI console run:
             ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256
        2. Compare that value with the observed value above, character by character.
        3. Only if they match, remove the stale entries:
             ssh-keygen -R {{ ansible_host }}
             ssh-keygen -R {{ ssh_alias | default(inventory_hostname) }}
        4. Reconnect once interactively and accept the verified key.
        5. Update expected_host_fingerprint for {{ inventory_hostname }} in
           ../../inventory/hosts.yml to the new value.
    success_msg: "SSH host fingerprint for {{ inventory_hostname }} is unchanged."
  when: ssh_validation_require_fingerprint_match | bool

- name: Confirm the authorized key in use is the migration key (no password fallback)
  ansible.builtin.command: "true"
  changed_when: false
  vars:
    _note: >-
      Reaching this task at all proves public-key authentication succeeded:
      ansible.cfg forces BatchMode=yes and PreferredAuthentications=publickey,
      so a password prompt would have failed the connection instead.

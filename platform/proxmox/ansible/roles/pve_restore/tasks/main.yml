---
# Stage 10. Restores the guests of the rebuilt node, strictly following the
# approved plan. Guests are always restored STOPPED.

- name: Require the destructive opt-in tag as well as the approval variables
  ansible.builtin.assert:
    that:
      - "'destructive' in ansible_run_tags or 'never' in ansible_run_tags"
    fail_msg: |
      The approval variables are set, but the destructive tasks in this play are
      tagged `never,destructive` and were therefore not requested.

      Re-run the same command with the explicit opt-in:
        --tags all,destructive
      (the Makefile targets for destructive stages already pass this).
    success_msg: "Destructive opt-in present (--tags all,destructive)."

- name: Load the approved restore plan
  ansible.builtin.set_fact:
    pve_restore_plan: "{{ lookup('file', pve_restore_plan_path) | from_json }}"

- name: Assert the plan targets this node
  ansible.builtin.assert:
    that:
      - pve_restore_plan.target_node == expected_hostname
    fail_msg: >-
      The restore plan targets '{{ pve_restore_plan.target_node }}' but this host is
      '{{ expected_hostname }}'.

- name: Assert the plan has no blocked entries
  ansible.builtin.assert:
    that:
      - pve_restore_plan.verdict == 'pass'
      - pve_restore_plan.counts.blocked == 0
    fail_msg: |
      The restore plan is not clean: {{ pve_restore_plan.counts.blocked }} blocked entries.
      Review artifacts/restore-plan.md, fix the underlying problems and regenerate the
      plan with `make build-restore-plan`.

- name: Restore each guest in plan order
  ansible.builtin.include_tasks: restore_one.yml
  loop: "{{ pve_restore_plan.entries }}"
  loop_control:
    loop_var: plan_entry
    label: "{{ plan_entry.original_vmid }} -> {{ plan_entry.target_vmid }} ({{ plan_entry.name }})"

- name: Summarise the restore
  ansible.builtin.debug:
    msg:
      - "Restored {{ pve_restore_plan.entries | length }} guest(s) onto {{ expected_hostname }}."
      - "All guests are STOPPED. Starting them requires playbooks/81-start-restored-guests.yml."

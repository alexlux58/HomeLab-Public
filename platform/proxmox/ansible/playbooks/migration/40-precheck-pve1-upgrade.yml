---
# Stage 6a — upgrade precheck for the seed node.
#
#   make precheck-upgrade-pve1
#
# Read-mostly: refreshes apt lists and runs `pve8to9 --full`. Changes nothing else
# and produces a repository change report that must be approved before stage 6b.
- name: Precheck the PVE 8 -> 9 upgrade of the seed node
  hosts: pve1
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tags: [stage6, precheck]

  roles:
    - role: pve_upgrade_precheck

  post_tasks:
    - name: Restate the target release, verified against official documentation
      ansible.builtin.debug:
        msg:
          - "Target release: Proxmox VE {{ target_pve_release }} (Debian {{ target_debian_suite }})"
          - "Upgrade guide:  https://pve.proxmox.com/wiki/Upgrade_from_8_to_9"
          - "Roadmap:        https://pve.proxmox.com/wiki/Roadmap"
          - ""
          - "Re-verify these at execution time. If Proxmox has released a newer"
          - "point release, update target_pve_release in inventory/group_vars/all.yml."

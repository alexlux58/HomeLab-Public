---
# Stage 9b — validate .12 after its manual clean installation.
#
#   make postinstall-pve2 EXTRA="-e allow_destroy_pve2=true \
#     -e destroy_confirmation_pve2='DESTROY pve2 192.168.0.12 AND DISCARD ALL FIVE GUESTS' \
#     -e pve2_reinstalled=true -e pve2_fingerprint_verified=true"
- name: Validate the rebuilt .12
  hosts: pve2
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tags: [stage9, postinstall]

  pre_tasks:
    - name: Require both approval values for the rebuild path
      ansible.builtin.assert:
        that:
          - allow_destroy_pve2 | bool
          - destroy_confirmation_pve2 == destroy_confirmation_pve2_required
        fail_msg: |
          This playbook only applies to a node that has been deliberately rebuilt.
          Both of these are required:
            -e allow_destroy_pve2=true
            -e destroy_confirmation_pve2='{{ destroy_confirmation_pve2_required }}'

    - name: Require the operator to confirm the reinstall happened
      ansible.builtin.assert:
        that:
          - pve2_reinstalled | bool
          - pve2_fingerprint_verified | bool
        fail_msg: |
          Run the ISO installation manually at the console first, then verify the new
          SSH host fingerprint (docs/reinstall-ssh-recovery.md) and re-run with:
            -e pve2_reinstalled=true -e pve2_fingerprint_verified=true

  roles:
    - role: ssh_validation

    - role: synology_nfs
      synology_nfs_action: preflight

    - role: synology_nfs
      synology_nfs_action: configure
      when: allow_configure_nfs_storage | bool

  tasks:
    - name: Confirm the hostname
      ansible.builtin.command: hostname
      changed_when: false
      register: post180_hostname

    - name: Assert the hostname is pve2
      ansible.builtin.assert:
        that:
          - post180_hostname.stdout | trim == 'pve2'
        fail_msg: "Hostname is '{{ post180_hostname.stdout | trim }}', expected 'pve2'."

    - name: Confirm the IP address
      ansible.builtin.command:
        argv: [ip, -br, address]
      changed_when: false
      register: post180_addr

    - name: Assert 192.168.0.12 is configured
      ansible.builtin.assert:
        that:
          - "'192.168.0.12' in post180_addr.stdout"
        fail_msg: "192.168.0.12 is not configured on this host."

    - name: Confirm the release
      ansible.builtin.command: pveversion
      changed_when: false
      register: post180_version

    - name: Assert the target release is installed
      ansible.builtin.assert:
        that:
          - post180_version.stdout is search('pve-manager/' ~ target_pve_release)
        fail_msg: "Expected PVE {{ target_pve_release }}, got {{ post180_version.stdout }}."

    - name: Check for pending updates
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: List upgradable packages
      ansible.builtin.command:
        argv: [apt, list, --upgradable]
      changed_when: false
      register: post180_upgradable

    - name: Check which Proxmox repositories are active
      ansible.builtin.command: apt-cache policy
      changed_when: false
      register: post180_enterprise_repo

    - name: Fail if the installer's enterprise repository is still active
      ansible.builtin.assert:
        that:
          - "'enterprise.proxmox.com' not in post180_enterprise_repo.stdout"
          - "'pve-no-subscription' in post180_enterprise_repo.stdout"
        fail_msg: |
          pve2 does not have a usable, exclusively no-subscription Proxmox
          repository policy:
          {{ post180_enterprise_repo.stdout }}

          Fix it in the web UI (pve2 -> Updates -> Repositories): disable
          pve-enterprise and the Ceph enterprise line, add No-Subscription, then
          Refresh and apply updates. Otherwise this node can never match the
          others' package versions, and a cluster of mismatched versions is not
          supported.
        success_msg: "Repository configuration is usable (no enterprise repo without a key)."

    - name: Report pending updates
      ansible.builtin.debug:
        msg: >-
          {{ (post180_upgradable.stdout_lines | length) - 1 }} package(s) upgradable.
          Apply them BEFORE joining so both nodes run identical versions.

    - name: Refuse cluster readiness while packages are pending
      ansible.builtin.assert:
        that:
          - (post180_upgradable.stdout_lines | length) == 1
        fail_msg: >-
          pve2 has {{ (post180_upgradable.stdout_lines | length) - 1 }} pending
          package update(s). Apply them and reboot before joining the cluster.
        success_msg: "No package updates are pending on pve2."

    - name: Confirm the bridges exist
      ansible.builtin.command:
        argv: [ip, -br, link, show, "{{ item }}"]
      changed_when: false
      loop: "{{ validation_required_bridges }}"

    - name: Compare bridges against the captured pre-rebuild configuration
      ansible.builtin.debug:
        msg:
          - "Compare the current /etc/network/interfaces against the capture:"
          - "  diff <(ssh pve2 cat /etc/network/interfaces) \\"
          - "       host-configs/pve2/latest/files/etc/network/interfaces"
          - "Restore any VLAN-aware or bond configuration the guests depend on."

    - name: Confirm the node has no guests
      ansible.builtin.shell: |
        set -o pipefail
        find /etc/pve/qemu-server /etc/pve/lxc -maxdepth 1 -type f -name '*.conf' -print | wc -l
      args:
        executable: /bin/bash
      changed_when: false
      register: post180_guests

    - name: Assert the node is empty
      ansible.builtin.assert:
        that:
          - (post180_guests.stdout | trim | int) == 0
        fail_msg: "pve2 has guests and cannot join a cluster until it is empty."

    - name: Explain how the captured snippets may inform a clean rebuild
      ansible.builtin.debug:
        msg:
          - "Old snippets and hook scripts are NOT restored automatically."
          - "Review host-configs/pve2/latest only as input to a clean rebuild."

    - name: Report readiness
      ansible.builtin.debug:
        msg: "pve2 is rebuilt, empty and ready to join. Next: `make join-pve2`."

---
# Stage 6b — the PVE 8 -> 9 in-place upgrade of the seed node.
#
#   See docs/migration-runbook.md for the required EXTRA_JSON approval values.
#
# This is the highest-risk stage that touches a host you cannot afford to lose.
# Every task that modifies the system is tagged `never,destructive` so it cannot
# run by accident, and the whole play refuses to start without verified backups.
#
# Official procedure: https://pve.proxmox.com/wiki/Upgrade_from_8_to_9
- name: Upgrade the seed node from PVE 8 to PVE 9
  hosts: pve1
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  tags: [stage6, upgrade]

  pre_tasks:
    - name: Require every approval flag
      ansible.builtin.assert:
        that:
          - allow_repo_change_pve1 | bool
          - repo_change_confirmation_pve1 == repo_change_confirmation_pve1_required
          - allow_upgrade_pve1 | bool
          - upgrade_confirmation_pve1 == upgrade_confirmation_pve1_required
          - console_access_confirmed_pve1 | bool
        fail_msg: |
          Refusing to upgrade {{ inventory_hostname }}. All of these are required:
            -e allow_repo_change_pve1=true
            -e repo_change_confirmation_pve1='{{ repo_change_confirmation_pve1_required }}'
            -e allow_upgrade_pve1=true
            -e upgrade_confirmation_pve1='{{ upgrade_confirmation_pve1_required }}'
            -e console_access_confirmed_pve1=true

          `console_access_confirmed_pve1` is your assertion that you have
          physical, IPMI or KVM access to this machine. If the network does not
          come back after the reboot, SSH cannot help you.

    - name: Require the destructive opt-in tag as well as the approval variables
      ansible.builtin.assert:
        that:
          - "'destructive' in ansible_run_tags or 'never' in ansible_run_tags"
        fail_msg: |
          The approval variables are set, but the destructive tasks in this play are
          tagged `never,destructive` and were therefore not requested.

          Re-run the same command with the explicit opt-in:
            --tags all,destructive
          (the Makefile targets for destructive stages already pass this).
        success_msg: "Destructive opt-in present (--tags all,destructive)."

    - name: Re-run the full precheck immediately before changing anything
      ansible.builtin.include_role:
        name: pve_upgrade_precheck
      vars:
        # The live stage performs the authoritative pve8to9 run after updating
        # to PVE 8.4 and applying the explicitly guarded boot prerequisites.
        pve_upgrade_precheck_run_pve8to9: false

    - name: Take a pre-upgrade discovery snapshot
      ansible.builtin.include_role:
        name: discovery

    - name: Save the pre-upgrade snapshot
      ansible.builtin.copy:
        content: |
          {{ {'schema_version': 1, 'generated_at': ansible_date_time.iso8601,
              'hosts': {inventory_hostname: discovery_host_document}} | to_nice_json }}
        dest: "{{ artifacts_dir }}/pre-upgrade-{{ expected_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false

  tasks:
    - name: Bring PVE 8 fully up to date first
      tags: [never, destructive]
      block:
        - name: Refresh package lists
          ansible.builtin.apt:
            update_cache: true

        - name: Upgrade to the latest PVE 8.4 packages
          ansible.builtin.apt:
            upgrade: dist
            autoremove: false
          register: upgrade_pve8_latest

        - name: Re-read the version
          ansible.builtin.command: pveversion
          changed_when: false
          register: upgrade_after_8x

        - name: Assert we are on at least the minimum 8.4 release
          ansible.builtin.assert:
            that:
              - (upgrade_after_8x.stdout | regex_search('pve-manager/([0-9.]+)', '\\1') | first)
                is version(pve8_minimum_before_upgrade, '>=')
            fail_msg: >-
              The official guide requires at least PVE {{ pve8_minimum_before_upgrade }}
              before upgrading; this host reports {{ upgrade_after_8x.stdout }}.

        - name: Check whether proxmox-boot-tool manages an EFI system partition
          ansible.builtin.stat:
            path: /etc/kernel/proxmox-boot-uuids
          register: upgrade_proxmox_boot_uuids

        - name: Confirm the GRUB EFI loader exists
          ansible.builtin.stat:
            path: /boot/efi/EFI/proxmox/grubx64.efi
          register: upgrade_grub_efi_loader

        - name: Confirm the EFI system partition is mounted
          ansible.builtin.command:
            argv: [findmnt, -n, -o, FSTYPE, /boot/efi]
          changed_when: false
          register: upgrade_efi_mount

        - name: Assert this host is using the diagnosed GRUB boot layout
          ansible.builtin.assert:
            that:
              - not upgrade_proxmox_boot_uuids.stat.exists
              - upgrade_grub_efi_loader.stat.exists
              - (upgrade_efi_mount.stdout | trim) == 'vfat'
            fail_msg: >-
              The diagnosed GRUB layout changed. Refusing to alter bootloader
              packages; inspect the console and boot configuration again.

        - name: Simulate removal of the conflicting systemd-boot meta-package
          ansible.builtin.command:
            argv: [apt-get, -s, remove, systemd-boot]
          changed_when: false
          register: upgrade_systemd_boot_removal_simulation

        - name: Assert the removal simulation affects only the known conflict
          ansible.builtin.assert:
            that:
              - upgrade_systemd_boot_removal_simulation.stdout is search('Remv systemd-boot ')
              - upgrade_systemd_boot_removal_simulation.stdout is not search('Remv (proxmox-ve|pve-manager|proxmox-kernel|grub)')
            fail_msg: |
              Removing systemd-boot would affect an unexpected critical package:
              {{ upgrade_systemd_boot_removal_simulation.stdout }}

        - name: Remove the systemd-boot meta-package rejected by pve8to9
          ansible.builtin.apt:
            name: systemd-boot
            state: absent
            autoremove: false

        - name: Configure GRUB to maintain the removable EFI loader
          ansible.builtin.command: debconf-set-selections
          args:
            stdin: "grub-efi-amd64 grub2/force_efi_extra_removable boolean true"
          changed_when: true

        - name: Reinstall GRUB with the removable EFI loader enabled
          ansible.builtin.command:
            argv: [apt-get, install, --reinstall, -y, grub-efi-amd64]
          environment:
            DEBIAN_FRONTEND: noninteractive
          changed_when: true

        - name: Enable Debian non-free-firmware for Intel microcode
          ansible.builtin.replace:
            path: /etc/apt/sources.list
            regexp: "^(deb\\s+\\S*debian\\S*\\s+\\S+\\s+main contrib)\\s*$"
            replace: "\\1 non-free-firmware"
            backup: true

        - name: Refresh package lists after enabling firmware packages
          ansible.builtin.apt:
            update_cache: true

        - name: Install Intel CPU microcode
          ansible.builtin.apt:
            name: intel-microcode
            state: present

        - name: Run pve8to9 again on the fully updated PVE 8
          ansible.builtin.command: pve8to9 --full
          changed_when: false
          failed_when: false
          register: upgrade_pve8to9_final

        - name: Require a successful and parseable final pve8to9 result
          ansible.builtin.assert:
            that:
              - (upgrade_pve8to9_final.rc | int) == 0
              - upgrade_pve8to9_final.stdout is regex('(?s).*FAILURES:\\s*\\d+.*')
              - upgrade_pve8to9_final.stdout is regex('(?s).*WARNINGS:\\s*\\d+.*')
            fail_msg: |
              The final pve8to9 command did not return a successful, parseable result.
              rc={{ upgrade_pve8to9_final.rc }}
              stdout={{ upgrade_pve8to9_final.stdout }}
              stderr={{ upgrade_pve8to9_final.stderr }}
              The PVE 9 repositories have not been enabled.

        - name: Extract the final pve8to9 counters
          ansible.builtin.set_fact:
            upgrade_pve8to9_failures: "{{ upgrade_pve8to9_final.stdout | regex_search('FAILURES:\\s*(\\d+)', '\\1') | first | int }}"
            upgrade_pve8to9_warnings: "{{ upgrade_pve8to9_final.stdout | regex_search('WARNINGS:\\s*(\\d+)', '\\1') | first | int }}"

        - name: Assert pve8to9 is clean
          ansible.builtin.assert:
            that:
              - (upgrade_pve8to9_failures | int) == 0
              - (upgrade_pve8to9_warnings | int) == 0
            fail_msg: |
              pve8to9 reports {{ upgrade_pve8to9_failures }} failure(s) and
              {{ upgrade_pve8to9_warnings }} warning(s). Both must be zero:
              {{ upgrade_pve8to9_final.stdout }}
              Resolve them before continuing.

    - name: Shut down important guests before the major upgrade
      tags: [never, destructive]
      block:
        - name: Record the current power state
          ansible.builtin.command:
            argv: [qm, status, "{{ item.vmid }}"]
          changed_when: false
          register: upgrade_power_states
          loop: "{{ protected_guests[inventory_hostname] }}"
          loop_control:
            label: "{{ item.vmid }}"

        - name: Save the power state for rollback
          ansible.builtin.copy:
            content: |
              {{ {'host': inventory_hostname, 'recorded_at': ansible_date_time.iso8601,
                  'states': dict(protected_guests[inventory_hostname] | map(attribute='vmid')
                    | zip(upgrade_power_states.results | map(attribute='stdout')
                    | map('regex_replace', '^status:\\s*', '') | map('trim')))} | to_nice_json }}
            dest: "{{ artifacts_dir }}/power-state-upgrade-{{ expected_hostname }}.json"
            mode: "0644"
          delegate_to: localhost
          become: false

        - name: Gracefully shut every guest down
          ansible.builtin.command:
            argv: [qm, shutdown, "{{ item.item.vmid }}", --timeout, "{{ guest_shutdown_timeout_seconds }}"]
          changed_when: true
          loop: "{{ upgrade_power_states.results }}"
          loop_control:
            label: "{{ item.item.vmid }}"
          when: "'running' in item.stdout"

        - name: Wait for every guest to stop
          ansible.builtin.command:
            argv: [qm, status, "{{ item.vmid }}"]
          changed_when: false
          register: upgrade_stopped
          until: "'status: stopped' in upgrade_stopped.stdout"
          retries: 30
          delay: 10
          loop: "{{ protected_guests[inventory_hostname] }}"
          loop_control:
            label: "{{ item.vmid }}"

    - name: Rewrite the repositories for Debian Trixie / PVE 9
      tags: [never, destructive]
      block:
        - name: Back up the current apt configuration
          ansible.builtin.command:
            argv:
              - tar
              - -czf
              - "{{ remote_work_dir }}/apt-sources-before-upgrade.tar.gz"
              - -C
              - /etc/apt
              - sources.list
              - sources.list.d
          changed_when: true

        - name: Repoint Debian repositories from bookworm to trixie
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: "\\b{{ source_debian_suite }}\\b"
            replace: "{{ target_debian_suite }}"
            backup: true
          loop: "{{ query('fileglob', '/etc/apt/sources.list.d/*.list') + ['/etc/apt/sources.list'] }}"
          failed_when: false

        - name: Repoint deb822 sources from bookworm to trixie
          ansible.builtin.replace:
            path: "{{ item }}"
            regexp: "^(Suites:.*)\\b{{ source_debian_suite }}\\b"
            replace: "\\1{{ target_debian_suite }}"
            backup: true
          loop: "{{ query('fileglob', '/etc/apt/sources.list.d/*.sources') }}"
          failed_when: false

        - name: Refresh package lists against the new suites
          ansible.builtin.apt:
            update_cache: true

    - name: Perform the distribution upgrade
      tags: [never, destructive]
      block:
        - name: Run the dist-upgrade
          ansible.builtin.apt:
            upgrade: dist
            autoremove: false
            dpkg_options: "force-confdef,force-confold"
          register: upgrade_dist
          async: 7200
          poll: 30

        - name: Show the upgrade summary
          ansible.builtin.debug:
            var: upgrade_dist.stdout_lines

        # The PVE 9 package can create this deb822 source during the upgrade,
        # after the repository rewrite above has already run.  Keep the
        # operator-selected no-subscription policy intact without deleting the
        # vendor file, so the change remains easy to reverse.
        - name: Check for a newly created enterprise repository source
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/pve-enterprise.sources
          register: upgrade_enterprise_source

        - name: Disable the newly created enterprise repository source
          ansible.builtin.lineinfile:
            path: /etc/apt/sources.list.d/pve-enterprise.sources
            regexp: '^Enabled:'
            line: 'Enabled: no'
            insertbefore: BOF
          when: upgrade_enterprise_source.stat.exists

    - name: Reboot into the new kernel
      tags: [never, destructive]
      block:
        - name: Reboot the node
          ansible.builtin.reboot:
            reboot_timeout: 900
            post_reboot_delay: 30
            msg: "PVE 8 -> 9 upgrade reboot"

        - name: Re-validate SSH access after the reboot
          ansible.builtin.include_role:
            name: ssh_validation
          vars:
            ssh_validation_require_fingerprint_match: true

  post_tasks:
    - name: Confirm the node now runs the target release
      ansible.builtin.command: pveversion
      changed_when: false
      register: upgrade_final_version

    - name: Assert the target release is running
      ansible.builtin.assert:
        that:
          - upgrade_final_version.stdout is search('pve-manager/' ~ target_pve_release ~ '\\.')
        fail_msg: "Expected Proxmox VE {{ target_pve_release }}, got {{ upgrade_final_version.stdout }}."

    - name: Take a post-upgrade discovery snapshot
      ansible.builtin.include_role:
        name: discovery

    - name: Save the post-upgrade snapshot
      ansible.builtin.copy:
        content: |
          {{ {'schema_version': 1, 'generated_at': ansible_date_time.iso8601,
              'hosts': {inventory_hostname: discovery_host_document}} | to_nice_json }}
        dest: "{{ artifacts_dir }}/post-upgrade-{{ expected_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Diff the pre- and post-upgrade state
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/.venv/bin/python"
          - "{{ scripts_dir }}/compare_pre_post_state.py"
          - --pre
          - "{{ artifacts_dir }}/pre-upgrade-{{ expected_hostname }}.json"
          - --post
          - "{{ artifacts_dir }}/post-upgrade-{{ expected_hostname }}.json"
          - --out-json
          - "{{ artifacts_dir }}/upgrade-diff-{{ expected_hostname }}.json"
          - --out-markdown
          - "{{ artifacts_dir }}/upgrade-diff-{{ expected_hostname }}.md"
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Report what to check before starting guests
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} now runs {{ upgrade_final_version.stdout }}."
          - "State diff: artifacts/upgrade-diff-{{ expected_hostname }}.md"
          - ""
          - "Before starting guests, confirm by hand:"
          - "  - networking:  ip -br a ; ip route ; ping the gateway"
          - "  - storage:     pvesm status  (every storage active)"
          - "  - guests:      qm list  (all {{ protected_guests[inventory_hostname] | length }} registered)"
          - "  - nested virt: cat /sys/module/kvm_intel/parameters/nested  (for EVE-NG)"
          - ""
          - "Then start guests one at a time and check each one before the next:"
          - "  qm start <vmid>"
          - "Original power state: artifacts/power-state-upgrade-{{ expected_hostname }}.json"

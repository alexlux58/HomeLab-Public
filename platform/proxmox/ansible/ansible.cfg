# ---------------------------------------------------------------------------
# Ansible configuration for the Proxmox cluster migration.
#
# Safety-relevant settings:
#   * host_key_checking is TRUE and is never overridden anywhere in this repo.
#   * No password plugins, no become passwords, no vault password files.
#   * Callbacks print full task diffs so a human can review before approving.
# ---------------------------------------------------------------------------
[defaults]
# Relative paths here resolve from this file's directory, not the caller's.
# synology_nfs lives with the NAS component and is shared by the migration.
inventory              = ../../../inventory/hosts.yml
roles_path             = roles:../../nas/ansible/roles
collections_path       = collections
# `community.general.yaml` was removed in community.general 12; the same
# readable output now comes from the built-in callback with result_format.
stdout_callback        = default
result_format          = yaml
callbacks_enabled      = ansible.posix.profile_tasks
force_valid_group_names = ignore
interpreter_python     = /usr/bin/python3
host_key_checking      = True
retry_files_enabled    = False
display_skipped_hosts  = False
deprecation_warnings   = True
command_warnings       = True
nocows                 = 1
timeout                = 60
forks                  = 3
# Time-sensitive manifests and gates must never reuse ansible_date_time from a
# previous run. Plays opt in with gather_facts: true when they need fresh facts.
gathering               = explicit
fact_caching            = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout    = 3600

[inventory]
unparsed_is_failed = True

[ssh_connection]
# BatchMode: never sit at an interactive password prompt. If key auth fails the
# run must fail loudly instead of hanging or falling back to a password.
# StrictHostKeyChecking is deliberately left at the system default (ask/yes) and
# is NEVER set to "no" anywhere in this project.
ssh_args        = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining      = True
scp_if_ssh      = smart
retries         = 0

[persistent_connection]
command_timeout = 120
connect_timeout = 60

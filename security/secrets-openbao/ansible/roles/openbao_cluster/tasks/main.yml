---
- name: Configure and start the uninitialized OpenBao node
  when: not openbao_cluster_validation_only | bool
  block:
    - name: Pin OpenBao cluster names to LAN addresses
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} OPENBAO CLUSTER"
        block: |
          {% for member in openbao_cluster_members %}
          {{ member.address }} {{ member.name }}.{{ openbao_domain }} {{ member.name }}
          {% endfor %}

    - name: Remove the Ubuntu loopback hostname that shadows the LAN API name
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1\\b"
        state: absent

    - name: Install OpenBao server configuration
      ansible.builtin.template:
        src: openbao.hcl.j2
        dest: /etc/openbao/openbao.hcl
        owner: root
        group: openbao-audit
        mode: "0640"
      notify: Restart OpenBao

    - name: Install HAProxy configuration
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        validate: haproxy -c -f %s
      notify: Restart HAProxy

    - name: Install Keepalived configuration
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart Keepalived

    - name: Install audit log rotation with safe reload
      ansible.builtin.copy:
        dest: /etc/logrotate.d/openbao-audit
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/openbao/audit.json {
              daily
              rotate 14
              compress
              delaycompress
              missingok
              notifempty
              create 0640 openbao openbao-audit
              sharedscripts
              postrotate
                  /bin/systemctl kill --kill-who=main --signal=HUP openbao.service 2>/dev/null || true
              endscript
          }

    - name: Enable HA and OpenBao services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - openbao
        - haproxy
        - keepalived

    - name: Flush OpenBao and HA handlers
      ansible.builtin.meta: flush_handlers

- name: Wait for the node TLS listener
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 8200
    timeout: 30
    state: started

- name: Query OpenBao initialization state over verified TLS
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}.{{ openbao_domain }}:8200/v1/sys/init"
    method: GET
    ca_path: /etc/openbao/tls/ca.pem
    return_content: true
    status_code: 200
  register: openbao_cluster_init_status
  changed_when: false

- name: Stop before initialization and require an attended ceremony
  ansible.builtin.assert:
    that:
      - not (openbao_cluster_init_status.json.initialized | bool)
    fail_msg: >-
      This validation gate expects an uninitialized cluster. If initialization
      was intentional, use the post-init validation stage instead.
    success_msg: "TLS is valid and OpenBao remains uninitialized. Stop for the attended ceremony."

---
- name: Inspect controller TLS inputs without reading their contents
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ openbao_tls_ca_source }}"
    - "{{ openbao_tls_cert_source }}"
    - "{{ openbao_tls_key_source }}"
  register: openbao_tls_controller_files
  delegate_to: localhost
  become: false

- name: Require all operator-managed TLS inputs
  ansible.builtin.assert:
    that:
      - openbao_tls_controller_files.results | map(attribute='stat.exists') | min
      - (openbao_tls_controller_files.results[2].stat.mode | default('')) == "0600"
    fail_msg: "TLS inputs are missing or the private key is not mode 0600."

- name: Install OpenBao CA certificate
  ansible.builtin.copy:
    src: "{{ openbao_tls_ca_source }}"
    dest: /etc/openbao/tls/ca.pem
    owner: root
    group: openbao-audit
    mode: "0644"

- name: Install node TLS certificate
  ansible.builtin.copy:
    src: "{{ openbao_tls_cert_source }}"
    dest: /etc/openbao/tls/server.pem
    owner: root
    group: openbao-audit
    mode: "0644"

- name: Install node TLS private key without logging material
  ansible.builtin.copy:
    src: "{{ openbao_tls_key_source }}"
    dest: /etc/openbao/tls/server-key.pem
    owner: root
    group: openbao-audit
    mode: "0640"
  no_log: true

- name: Validate certificate chain and hostname
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - /etc/openbao/tls/ca.pem
      - -verify_hostname
      - "{{ inventory_hostname }}.{{ openbao_domain }}"
      - /etc/openbao/tls/server.pem
  changed_when: false

- name: Assert the TLS private key matches the certificate
  ansible.builtin.shell: >-
    set -o pipefail &&
    test "$(openssl x509 -in /etc/openbao/tls/server.pem -pubkey -noout | openssl sha256)" =
    "$(openssl pkey -in /etc/openbao/tls/server-key.pem -pubout | openssl sha256)"
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

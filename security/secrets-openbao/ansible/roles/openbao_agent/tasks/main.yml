---
- name: Configure backup AppRole Agent only on the backup node
  when: inventory_hostname == openbao_agent_backup_node
  block:
    - name: Create protected OpenBao Agent directory
      ansible.builtin.file:
        path: /etc/openbao/agent/backup
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Inspect operator-installed AppRole inputs without reading values
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openbao_backup_approle_role_id_file }}"
        - "{{ openbao_backup_approle_secret_id_file }}"
      register: openbao_agent_approle_files

    - name: Require protected AppRole inputs
      ansible.builtin.assert:
        that:
          - openbao_agent_approle_files.results | map(attribute='stat.exists') | min
          - openbao_agent_approle_files.results[1].stat.mode == "0600"
        fail_msg: "Install the backup role-id and mode-0600 SecretID before enabling the Agent."

    - name: Install backup Agent configuration
      ansible.builtin.template:
        src: backup-agent.hcl.j2
        dest: /etc/openbao/agent/backup/agent.hcl
        owner: root
        group: root
        mode: "0600"

    - name: Install backup Agent systemd unit
      ansible.builtin.template:
        src: openbao-agent-backup.service.j2
        dest: /etc/systemd/system/openbao-agent-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable the renewable backup token Agent
      ansible.builtin.systemd_service:
        name: openbao-agent-backup
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the protected Agent token sink
      ansible.builtin.wait_for:
        path: "{{ openbao_backup_agent_token_file }}"
        timeout: 30
        state: present

    - name: Inspect Agent token metadata without reading its value
      ansible.builtin.stat:
        path: "{{ openbao_backup_agent_token_file }}"
      register: openbao_agent_token_metadata

    - name: Require a nonempty mode-0600 Agent token sink
      ansible.builtin.assert:
        that:
          - openbao_agent_token_metadata.stat.size | int > 0
          - openbao_agent_token_metadata.stat.mode == "0600"
        fail_msg: "OpenBao Agent did not create a protected token sink."

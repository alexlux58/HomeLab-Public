---
- name: Assert supported Ubuntu platform and resource floor
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version('24.04', '>=')
      - ansible_architecture == "x86_64"
      - ansible_memtotal_mb | int >= openbao_preflight_min_memory_mb
      - (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_total') | first | int) >= openbao_preflight_min_disk_gb * 1024 * 1024 * 1024
    fail_msg: "OpenBao host does not meet the supported OS or resource floor."

- name: Read cloud-init completion state
  ansible.builtin.command: cloud-init status --format json
  register: openbao_preflight_cloud_init
  changed_when: false
  # Ubuntu 24 cloud-init exits 2 when status is "degraded done" solely because
  # the Terraform user-data still uses the deprecated singular `user` key.
  failed_when: openbao_preflight_cloud_init.rc not in [0, 2]

- name: Assert cloud-init completed successfully
  ansible.builtin.assert:
    that:
      - (openbao_preflight_cloud_init.stdout | from_json).status == "done"
      - ((openbao_preflight_cloud_init.stdout | from_json).errors | default([]) | length) == 0
    fail_msg: "Cloud-init is not complete or reported errors."

- name: Resolve every OpenBao node name through configured DNS
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ item.name }}.{{ openbao_domain }}"
  loop: "{{ openbao_cluster_members }}"
  changed_when: false

- name: Read current time synchronization state
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: openbao_preflight_ntp
  changed_when: false

- name: Require synchronized time
  ansible.builtin.assert:
    that:
      - openbao_preflight_ntp.stdout | trim == "yes"
    fail_msg: "NTP is not synchronized; do not form a Raft cluster."

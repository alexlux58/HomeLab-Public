---
- name: Configure backup only on the elected backup node
  when: inventory_hostname == openbao_backup_primary_node
  block:
    - name: Create append-only local snapshot directory
      ansible.builtin.file:
        path: "{{ openbao_backup_local_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Inspect operator-installed backup runtime files without reading values
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openbao_backup_age_recipient_file }}"
        - "{{ openbao_backup_sftp_key_file }}"
        - "{{ openbao_backup_sftp_known_hosts_file }}"
        - "{{ openbao_backup_agent_token_file }}"
      register: openbao_backup_runtime_files

    - name: Require backup runtime files and restrictive private permissions
      ansible.builtin.assert:
        that:
          - openbao_backup_runtime_files.results | map(attribute='stat.exists') | min
          - openbao_backup_runtime_files.results[1].stat.mode == "0600"
          - openbao_backup_runtime_files.results[3].stat.mode == "0600"
        fail_msg: >-
          Backup runtime files are incomplete. Install the age recipient, SFTP
          key, pinned known_hosts, and Agent token without exposing their values.

    - name: Install Raft snapshot backup program
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/raft_snapshot.py"
        dest: "{{ openbao_backup_script_path }}"
        owner: root
        group: root
        mode: "0750"

    - name: Install OpenBao backup service
      ansible.builtin.template:
        src: openbao-raft-backup.service.j2
        dest: /etc/systemd/system/openbao-raft-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Install OpenBao backup timer
      ansible.builtin.template:
        src: openbao-raft-backup.timer.j2
        dest: /etc/systemd/system/openbao-raft-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable daily encrypted OpenBao backup timer
      ansible.builtin.systemd_service:
        name: openbao-raft-backup.timer
        enabled: true
        state: started
        daemon_reload: true

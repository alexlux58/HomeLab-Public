---
- name: Install low-overhead Node Exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable Node Exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Create native Alloy configuration directory
  ansible.builtin.file:
    path: "{{ openbao_monitoring_alloy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install bounded low-cardinality OpenBao audit shipping fragment
  ansible.builtin.template:
    src: openbao.alloy.j2
    dest: "{{ openbao_monitoring_alloy_config_dir }}/openbao.alloy"
    owner: root
    group: root
    mode: "0644"

- name: Report the explicit Alloy ownership boundary
  ansible.builtin.debug:
    msg: >-
      The audited fragment is installed. The existing homelab-observability
      repository owns the pinned native Alloy binary/service and must include
      /etc/alloy/openbao.alloy after its separately reviewed agent stage.
  changed_when: false

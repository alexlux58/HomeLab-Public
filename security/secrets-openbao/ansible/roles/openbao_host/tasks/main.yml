---
- name: Update the apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install OpenBao host prerequisites
  ansible.builtin.apt:
    name: "{{ openbao_host_packages }}"
    state: present

- name: Create restricted OpenBao audit group
  ansible.builtin.group:
    name: openbao-audit
    system: true
    state: present

- name: Create OpenBao service account
  ansible.builtin.user:
    name: openbao
    group: openbao-audit
    home: /var/lib/openbao
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create OpenBao directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/openbao, owner: root, group: openbao-audit, mode: "0750"}
    - {path: /etc/openbao/tls, owner: root, group: openbao-audit, mode: "0750"}
    - {path: /etc/openbao/backup, owner: root, group: root, mode: "0700"}
    - {path: /var/lib/openbao, owner: openbao, group: openbao-audit, mode: "0750"}
    - {path: /var/lib/openbao/raft, owner: openbao, group: openbao-audit, mode: "0750"}
    - {path: /var/log/openbao, owner: openbao, group: openbao-audit, mode: "0750"}

- name: Enforce key-only SSH authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-openbao-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowUsers openbao-admin
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bound persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-openbao.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=512M
      RuntimeMaxUse=128M
      MaxRetentionSec=14day
  notify: Restart journald

- name: Allow HAProxy to bind the floating address while this node is standby
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-openbao-vip.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_nonlocal_bind = 1
  notify: Apply OpenBao sysctl

- name: Allow LAN SSH administration  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, allow, from, "{{ openbao_lan_cidr }}", to, any, port, "22", proto, tcp, comment, Home Lab SSH]
  register: openbao_host_ufw_ssh
  changed_when: "'Rule added' in openbao_host_ufw_ssh.stdout"

- name: Allow LAN OpenBao API access  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, allow, from, "{{ openbao_lan_cidr }}", to, any, port, "8200", proto, tcp, comment, OpenBao API]
  register: openbao_host_ufw_api
  changed_when: "'Rule added' in openbao_host_ufw_api.stdout"

- name: Allow Raft peers and VRRP traffic only from cluster members  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, allow, from, "{{ item.address }}", comment, "OpenBao peer {{ item.name }}"]
  loop: "{{ openbao_cluster_members }}"
  when: item.address != ansible_host
  register: openbao_host_ufw_peers
  changed_when: "'Rule added' in openbao_host_ufw_peers.stdout"

- name: Allow Node Exporter only from observability  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, allow, from, "{{ openbao_observability_ip }}", to, any, port, "9100", proto, tcp, comment, Observability scrape]
  register: openbao_host_ufw_exporter
  changed_when: "'Rule added' in openbao_host_ufw_exporter.stdout"

- name: Set default-deny UFW incoming policy  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, default, deny, incoming]
  register: openbao_host_ufw_policy
  changed_when: "'Default incoming policy changed' in openbao_host_ufw_policy.stdout"

- name: Read UFW state  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, status]
  register: openbao_host_ufw_status
  changed_when: false

- name: Enable UFW when inactive  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when: "'Status: inactive' in openbao_host_ufw_status.stdout"
  changed_when: true

- name: Enable guest and time services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - qemu-guest-agent

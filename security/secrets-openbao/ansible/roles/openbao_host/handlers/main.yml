---
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Apply OpenBao sysctl  # noqa command-instead-of-module
  ansible.builtin.command:
    argv: [sysctl, --system]
  changed_when: true

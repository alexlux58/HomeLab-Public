---
- name: Inspect local OpenBao audit file metadata
  ansible.builtin.stat:
    path: "{{ openbao_audit_log_path }}"
  register: openbao_audit_metadata

- name: Require protected local audit storage when initialized
  ansible.builtin.assert:
    that:
      - openbao_audit_metadata.stat.exists
      - openbao_audit_metadata.stat.mode == "0640"
      - openbao_audit_metadata.stat.gr_name == "openbao-audit"
    fail_msg: "OpenBao audit log is missing or has unsafe ownership/mode."

---
- name: Create versioned OpenBao download directory
  ansible.builtin.file:
    path: "{{ openbao_server_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download pinned OpenBao release and verification material
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ openbao_server_download_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop:
    - name: "{{ openbao_server_archive }}"
      url: "{{ openbao_server_release_base }}/{{ openbao_server_archive }}"
    - name: checksums.txt
      url: "{{ openbao_server_release_base }}/checksums.txt"
    - name: checksums.txt.gpgsig
      url: "{{ openbao_server_release_base }}/checksums.txt.gpgsig"
    - name: openbao-release.asc
      url: https://openbao.org/assets/openbao-gpg-pub-20240618.asc

- name: Inspect the OpenBao release signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ openbao_server_download_dir }}/openbao-release.asc"
  register: openbao_server_signing_key
  changed_when: false

- name: Require the pinned OpenBao release key fingerprint
  ansible.builtin.assert:
    that:
      - openbao_release_key_fingerprint in (openbao_server_signing_key.stdout | replace(':', ''))
    fail_msg: "The downloaded OpenBao signing key does not match the pinned fingerprint."

- name: Create isolated release verification keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - "{{ openbao_server_download_dir }}/openbao-release.gpg"
      - "{{ openbao_server_download_dir }}/openbao-release.asc"
    creates: "{{ openbao_server_download_dir }}/openbao-release.gpg"

- name: Verify the signed OpenBao checksum manifest
  ansible.builtin.command:
    argv:
      - gpgv
      - --keyring
      - "{{ openbao_server_download_dir }}/openbao-release.gpg"
      - "{{ openbao_server_download_dir }}/checksums.txt.gpgsig"
      - "{{ openbao_server_download_dir }}/checksums.txt"
  changed_when: false

- name: Verify the OpenBao archive SHA-256 against the signed manifest
  ansible.builtin.command:
    argv:
      - sha256sum
      - --ignore-missing
      - --check
      - checksums.txt
    chdir: "{{ openbao_server_download_dir }}"
  register: openbao_server_checksum
  changed_when: false

- name: Require verification of the exact pinned archive
  ansible.builtin.assert:
    that:
      - "(openbao_server_archive + ': OK') in openbao_server_checksum.stdout"
    fail_msg: "The pinned OpenBao archive did not pass signed checksum verification."

- name: Extract only the verified bao binary
  ansible.builtin.unarchive:
    src: "{{ openbao_server_download_dir }}/{{ openbao_server_archive }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - bao
    owner: root
    group: root
    mode: "0755"
  notify: Reload systemd

- name: Install hardened OpenBao systemd unit without starting it
  ansible.builtin.template:
    src: openbao.service.j2
    dest: /etc/systemd/system/openbao.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd changes before version check
  ansible.builtin.meta: flush_handlers

- name: Read installed OpenBao version
  ansible.builtin.command: /usr/local/bin/bao version
  register: openbao_server_installed_version
  changed_when: false

- name: Require the pinned OpenBao version
  ansible.builtin.assert:
    that:
      - openbao_version in openbao_server_installed_version.stdout
    fail_msg: "Installed OpenBao version does not match the repository pin."

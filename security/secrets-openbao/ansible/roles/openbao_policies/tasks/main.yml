---
- name: Reconcile version-controlled ACL policies through the local controller
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../../scripts/configure_openbao.py"
      - --address
      - "https://{{ openbao_api_dns_name }}:8200"
      - --ca-cert
      - "{{ openbao_tls_controller_root }}/ca.pem"
      - --token-file
      - "{{ openbao_operator_token_file }}"
      - --root
      - "{{ playbook_dir }}/../.."
      - --phase
      - "{{ openbao_policies_phase }}"
  when: inventory_hostname == groups.openbao_servers[0]
  delegate_to: localhost
  changed_when: false
  no_log: true

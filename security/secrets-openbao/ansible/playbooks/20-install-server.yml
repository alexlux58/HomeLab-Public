---
- name: Install verified OpenBao server binary
  hosts: openbao_servers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact OpenBao installation approval
      ansible.builtin.assert:
        that:
          - allow_install_openbao | bool
          - install_openbao_confirmation == "INSTALL OPENBAO 2.6.1 WITHOUT INITIALIZING"
        fail_msg: "OpenBao installation is not approved."

  roles:
    - role: openbao_server

---
- name: Configure OpenBao Raft and floating API endpoint
  hosts: openbao_servers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact HA configuration approval
      ansible.builtin.assert:
        that:
          - allow_configure_openbao_ha | bool
          - configure_openbao_ha_confirmation == "CONFIGURE OPENBAO RAFT AND VIP UNINITIALIZED"
        fail_msg: "OpenBao HA configuration is not approved."

  roles:
    - role: openbao_cluster

---
- name: Configure OpenBao metrics and audit shipping inputs
  hosts: openbao_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact monitoring configuration approval
      ansible.builtin.assert:
        that:
          - allow_configure_openbao_monitoring | bool
          - configure_openbao_monitoring_confirmation == "CONFIGURE OPENBAO MONITORING AND AUDIT SHIPPING"
        fail_msg: "OpenBao monitoring configuration is not approved."

  roles:
    - role: openbao_audit
    - role: openbao_monitoring

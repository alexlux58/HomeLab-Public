---
- name: Prepare OpenBao Ubuntu hosts
  hosts: openbao_servers
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact host preparation approval
      ansible.builtin.assert:
        that:
          - allow_prepare_openbao_hosts | bool
          - prepare_openbao_hosts_confirmation == "PREPARE OPENBAO HOSTS 320 321 322"
        fail_msg: "Host preparation is not approved."

  roles:
    - role: openbao_host

---
- name: Validate initialized OpenBao cluster without exposing values
  hosts: openbao_servers
  become: false
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Run one controller-side authenticated cluster validation
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../../scripts/validate_cluster.py"
          - --address
          - "https://{{ openbao_api_dns_name }}:8200"
          - --ca-cert
          - "{{ openbao_tls_controller_root }}/ca.pem"
          - --token-file
          - "{{ openbao_operator_token_file }}"
          - --expected-peers
          - "3"
      when: inventory_hostname == groups.openbao_servers[0]
      delegate_to: localhost
      changed_when: false
      no_log: true

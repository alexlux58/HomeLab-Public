---
- name: Report safe rollback boundary
  hosts: openbao_servers
  become: false
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Direct the operator to the reviewed rollback runbook
      ansible.builtin.debug:
        msg: >-
          Automated destructive rollback is intentionally unavailable. Stop
          clients, preserve Raft data and logs, and follow docs/troubleshooting.md
          and docs/restore-runbook.md.
      changed_when: false

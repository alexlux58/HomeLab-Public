---
- name: Run one application-consistent encrypted OpenBao backup
  hosts: bao-1
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact one-time backup approval
      ansible.builtin.assert:
        that:
          - allow_run_openbao_backup | bool
          - run_openbao_backup_confirmation == "RUN ONE OPENBAO RAFT BACKUP"
        fail_msg: "One-time OpenBao backup is not approved."

  tasks:
    - name: Start the application-consistent backup service
      ansible.builtin.systemd_service:
        name: openbao-raft-backup.service
        state: started

    - name: Read backup service result  # noqa command-instead-of-module
      ansible.builtin.command: systemctl show openbao-raft-backup.service --property=Result --value
      register: openbao_backup_now_result
      changed_when: false

    - name: Require a successful backup service result
      ansible.builtin.assert:
        that:
          - openbao_backup_now_result.stdout | trim == "success"
        fail_msg: "OpenBao backup failed; preserve all local evidence and investigate."

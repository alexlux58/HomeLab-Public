---
- name: Validate isolated OpenBao restore prerequisites only
  hosts: openbao_servers
  become: false
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Explain why production restore is not automated
      ansible.builtin.debug:
        msg: >-
          Use scripts/verify_snapshot.py on an operator workstation, then follow
          docs/restore-runbook.md in a protected VM on an isolated bridge. This
          playbook never restores into a production Raft cluster.
      changed_when: false

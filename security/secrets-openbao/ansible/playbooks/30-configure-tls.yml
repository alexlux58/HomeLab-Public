---
- name: Deploy operator-approved OpenBao TLS material
  hosts: openbao_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact TLS deployment approval
      ansible.builtin.assert:
        that:
          - allow_configure_openbao_tls | bool
          - configure_openbao_tls_confirmation == "DEPLOY OPENBAO TLS TO THREE NODES"
        fail_msg: "TLS deployment is not approved."

  roles:
    - role: openbao_tls

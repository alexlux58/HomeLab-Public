---
- name: Configure encrypted OpenBao Raft backups
  hosts: openbao_servers
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact backup configuration approval
      ansible.builtin.assert:
        that:
          - allow_configure_openbao_backup | bool
          - configure_openbao_backup_confirmation == "CONFIGURE ENCRYPTED OPENBAO RAFT BACKUPS"
        fail_msg: "OpenBao backup configuration is not approved."

  roles:
    - role: openbao_agent
    - role: openbao_backup

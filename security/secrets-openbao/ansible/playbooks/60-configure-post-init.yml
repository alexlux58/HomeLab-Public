---
- name: Reconcile non-secret OpenBao policies authentication and engines
  hosts: openbao_servers
  become: false
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  pre_tasks:
    - name: Require exact post-initialization approval
      ansible.builtin.assert:
        that:
          - allow_configure_openbao_post_init | bool
          - configure_openbao_post_init_confirmation == "CONFIGURE OPENBAO POST INIT NO SECRET VALUES"
        fail_msg: "Post-initialization configuration is not approved."

  roles:
    - role: openbao_policies
    - role: openbao_auth
    - role: openbao_pki

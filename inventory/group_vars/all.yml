---
# ===========================================================================
# Central configuration for the migration.
#
# Everything an operator is expected to change lives here. Approval gates all
# default to "refuse to run"; they are switched on per-invocation with -e on
# the command line so that no destructive default can ever be committed to Git.
# ===========================================================================

# ---------------------------------------------------------------------------
# SSH / controller
# ---------------------------------------------------------------------------
# Single source of truth for the key name. Change this one value if your key
# file is named differently; nothing else in the repository hardcodes it.
ssh_key_name: proxmox_cluster_ed25519
ssh_private_key_file: "~/.ssh/{{ ssh_key_name }}"
ssh_public_key_file: "~/.ssh/{{ ssh_key_name }}.pub"
ssh_known_hosts_file: "~/.ssh/known_hosts"

# ---------------------------------------------------------------------------
# Controller-side paths
# ---------------------------------------------------------------------------
# The migration controller root (platform/proxmox). Its Makefile, and the NAS
# Makefile that reuses its discovery artifacts, pass it with -e; the fallback
# is correct for playbooks under ansible/playbooks/migration/.
project_root: "{{ playbook_dir | dirname | dirname | dirname }}"
artifacts_dir: "{{ project_root }}/artifacts"
host_configs_dir: "{{ project_root }}/host-configs"
scripts_dir: "{{ project_root }}/scripts"

# Remote scratch directory. Created under /root, never under /etc/pve.
remote_work_dir: /root/.pve-migration

# ---------------------------------------------------------------------------
# Target release
#
# Verified against https://pve.proxmox.com/wiki/Roadmap and the Proxmox VE 9.2
# press release (2026-05-21). Re-verify at execution time — the precheck
# playbook prints the observed versions and refuses to proceed on a mismatch.
# ---------------------------------------------------------------------------
target_pve_release: "9.2"
target_pve_major: 9
# The official 8 -> 9 upgrade guide requires the latest 8.4 first (>= 8.4.1).
pve8_minimum_before_upgrade: "8.4.1"
# Debian codename that PVE 9.x is based on (used by the repository report).
target_debian_suite: trixie
source_debian_suite: bookworm

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------
cluster_name: homelab
cluster_seed_host: pve1
cluster_seed_ip: 192.168.0.11
# Corosync/knet unicast range documented in the Cluster Manager chapter.
corosync_udp_port_range: [5405, 5412]
corosync_max_latency_ms: 5
# HA is deliberately NOT enabled: there is no shared guest storage in this
# design, so HA would only produce fencing surprises. See docs/architecture.md.
enable_ha: false

# ---------------------------------------------------------------------------
# Synology NAS (backup target)
# ---------------------------------------------------------------------------
nas_ip: 192.168.0.20
nas_dsm_https_port: 5001
nas_share_name: proxmox-cluster-backups
nas_export_path: "/volume1/{{ nas_share_name }}"
nas_storage_id: synology-backup
nas_storage_content: "backup"
# HARD ABORT if the resolved export or mount source touches any of these.
# Volume 2 sits on Storage Pool 1, which has 0 bytes free and a health warning.
nas_forbidden_path_prefixes:
  - /volume2
  - /volume3
nas_required_volume_prefix: /volume1
# Only these three clients may be granted access in DSM.
nas_allowed_clients:
  - 192.168.0.11
  - 192.168.0.12
  - 192.168.0.13
# No explicit version: `vers=` and `nfsvers=` are aliases and mount.nfs refuses
# both, and hardcoding 4.2 fails outright when DSM is capped at 4.1. The probe
# mount negotiates the highest version both ends support, the preflight records
# what was actually negotiated, and the Proxmox storage is then pinned to that.
nas_mount_options: "hard,noatime"
nas_minimum_nfs_major: 4
# Preflight thresholds
nas_min_free_gib: 512
backup_capacity_margin_pct: 30
# Conservative sizing: assume archives are this fraction of provisioned disk.
# 1.0 == assume zero compression benefit (worst case). Lower it only after you
# have measured real ratios on your own workloads.
backup_compression_ratio_assumption: 1.0
nas_preflight_min_write_mbps: 20
nas_preflight_test_size_mib: 64

# ---------------------------------------------------------------------------
# Guests
# ---------------------------------------------------------------------------
# Declared expectations. Discovery compares reality against this list and fails
# if a protected guest is missing, so a typo here cannot silently drop a VM.
protected_guests:
  pve1:
    # 2026-08-22: the operator deleted 287 p2pweb, 9000 ubuntu-2404-cloudinit
    # (template) and 9050 nr-ktranslate-01. Removing them from this list is what
    # stops stage 3 from failing its "every protected guest exists" assertion.
    # Re-add any entry here if a deletion turns out to have been accidental.
    #
    # 2026-09-19: the operator confirmed 297 ubuntu-vm obsolete and destroyed it.
    # Its config, local disks and snapshots are gone, verified by `qm config 297`
    # reporting no such file and /var/lib/vz/images/ holding only 290/ 310/ 320/.
    # It is removed here for the same reason as the 2026-08-22 deletions: this
    # list drives vzdump_backup_targets, so leaving it would make every backup
    # stage attempt a guest that does not exist.
    # ITS TWO NAS ARCHIVES FROM 2026-08-22/23 ARE RETAINED AND MUST NEVER BE
    # DELETED - together with host-configs/pve1/20260822T144104/.../297.conf
    # they are the only remaining representation of that guest. Do not restore,
    # reuse or repurpose VMID 297 without explicit operator approval.
    - {vmid: 290, name: EVENG, type: qemu}

# The operator chose on 2026-08-22 to rebuild these workloads later instead of
# preserving their current disks. They are deliberately excluded from every
# backup and restore gate. docs/rebuild-catalog.md records what to recreate.
disposable_guests:
  pve2:
    # NOTE: the guest is really named 'Ansbile-Puppet' on the host (sic).
    - {vmid: 100, name: Ansbile-Puppet, type: qemu}
    - {vmid: 101, name: lab-k3s, type: qemu}
    - {vmid: 102, name: UbuntuServer2, type: qemu}
    - {vmid: 9000, name: ubuntu-jammy-ci, type: qemu}
    - {vmid: 9100, name: metasploitable2, type: qemu}
  pve:
    - {vmid: 100, name: NIXOS, type: qemu}
    - {vmid: 101, name: Kali, type: qemu}
    - {vmid: 102, name: ProxmoxDatacenterManager, type: qemu}

# ---------------------------------------------------------------------------
# VMID collision policy
# ---------------------------------------------------------------------------
# Only .11 guests survive the clean installs, so every collision involving
# .12 or .13 resolves during rebuild and no VMID remap is required.
vmid_preserve_priority_host: pve1
vmid_preferred_remap: {}
vmid_search_range: {start: 9200, end: 9999}
# Renumbering the Proxmox VMID must never touch the guest's internal IP.
vmid_remap_touches_guest_network: false

# ---------------------------------------------------------------------------
# Backups
# ---------------------------------------------------------------------------
backup_verify_generations: [initial, final]
vzdump_compress: zstd
vzdump_zstd_threads: 0          # 0 == use all available cores
vzdump_initial_mode: snapshot   # generation 1: live
vzdump_final_mode: stop         # generation 2: cleanly shut down
vzdump_bwlimit_kbps: 0          # 0 == unlimited
vzdump_async_seconds: 43200     # 12h ceiling per guest
vzdump_poll_seconds: 30
vzdump_notes_template: "{{ '{{guestname}} from {{node}} — migration generation' }}"
# Pruning and archive deletion are NEVER performed by this project.
never_prune_backups: true

# ---------------------------------------------------------------------------
# Guest shutdown behaviour (stage 4)
# ---------------------------------------------------------------------------
guest_shutdown_timeout_seconds: 300
guest_shutdown_poll_seconds: 10
# Guests whose data is only crash-consistent under snapshot mode. Reported
# loudly in the backup summary so the operator schedules an app-level dump.
application_consistency_warn_guests:
  - {vmid: 290, name: EVENG, reason: "EVE-NG nested labs: shut lab nodes down for a consistent image"}

# ---------------------------------------------------------------------------
# Restore
# ---------------------------------------------------------------------------
restore_default_storage: local-lvm
restore_start_after_restore: false
# metasploitable2 is an intentionally vulnerable image. It must never reach a
# routed network. Either keep the NIC link down or attach it to an isolated,
# explicitly approved bridge.
isolated_guests:
  - {vmid: 9100, name: metasploitable2, mode: link_down}
isolated_lab_bridge: ""          # e.g. vmbr9 — must be approved and must not be routed

# ---------------------------------------------------------------------------
# Legacy test-restore variables
# ---------------------------------------------------------------------------
# The current migration does not run stage 5b: the only protected guests are 80
# GiB and 165 GiB, while .13 cannot safely hold either after reinstall. Archive
# integrity is established by SHA-256 plus `vma verify`; no guest is temporarily
# restored and deleted.
test_restore_source_host: pve1
test_restore_source_vmid: 9100
test_restore_target_vmid: 999
test_restore_target_storage: local-lvm

# ---------------------------------------------------------------------------
# APPROVAL GATES — all default to refuse. Supply with -e at run time.
# Every one of these is paired with an exact confirmation string.
# ---------------------------------------------------------------------------
allow_configure_nfs_storage: false

allow_guest_shutdown: false
guest_shutdown_confirmation: ""
guest_shutdown_confirmation_required: "SHUTDOWN GUESTS FOR FINAL BACKUP"

allow_repo_change_pve1: false
repo_change_confirmation_pve1: ""
repo_change_confirmation_pve1_required: "CHANGE REPOSITORIES pve1 192.168.0.11"

allow_upgrade_pve1: false
upgrade_confirmation_pve1: ""
upgrade_confirmation_pve1_required: "UPGRADE pve1 192.168.0.11 TO PVE 9"
# The operator must positively assert out-of-band recovery access exists.
console_access_confirmed_pve1: false

allow_create_cluster: false
create_cluster_confirmation: ""
create_cluster_confirmation_required: "CREATE CLUSTER homelab ON pve1 192.168.0.11"

allow_join_pve3: false
join_confirmation_pve3: ""
join_confirmation_pve3_required: "JOIN pve3 192.168.0.13 TO homelab"

allow_destroy_pve2: false
destroy_confirmation_pve2: ""
destroy_confirmation_pve2_required: "DESTROY pve2 192.168.0.12 AND DISCARD ALL FIVE GUESTS"

allow_join_pve2: false
join_confirmation_pve2: ""
join_confirmation_pve2_required: "JOIN pve2 192.168.0.12 TO homelab"

allow_restore_pve2: false
restore_confirmation_pve2: ""
restore_confirmation_pve2_required: "RESTORE pve2 GUESTS FROM VERIFIED BACKUP"

allow_start_restored_guests: false
start_restored_confirmation: ""
start_restored_confirmation_required: "START RESTORED GUESTS ON pve2"

allow_delete_test_restore: false
delete_test_restore_confirmation: ""
delete_test_restore_confirmation_required: "DELETE TEST RESTORE 999 ON pve3"

# Post-reinstall acknowledgements. Set to true only after the operator has
# personally verified the new SSH host fingerprint at the physical console.
pve3_reinstalled: false
pve3_fingerprint_verified: false
pve2_reinstalled: false
pve2_fingerprint_verified: false

# ---------------------------------------------------------------------------
# Cluster join mechanics
# ---------------------------------------------------------------------------
# `pvecm add` authenticates to the seed and normally prompts for the seed's
# root password. This project never handles passwords, so the default is
# "manual": Ansible performs every pre-check, prints the exact command, and the
# operator runs it once at the node's console. Set to "ssh_key_trust" to let
# Ansible establish node->seed root key trust first (using the joining node's
# EXISTING root key and the seed's host key read over an already-authenticated
# channel — never a blind host-key accept) so that `pvecm add --use_ssh` runs
# without a password prompt.
join_method: manual
pve3_join_executed: false
pve2_join_executed: false

# ---------------------------------------------------------------------------
# Validation expectations (stage 11)
# ---------------------------------------------------------------------------
expected_cluster_nodes: [pve1, pve2, pve3]
expected_quorum_votes: 3
validation_dns_probe: "proxmox.com"
validation_required_bridges: [vmbr0]

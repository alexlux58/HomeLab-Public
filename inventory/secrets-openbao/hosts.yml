---
all:
  children:
    openbao_servers:
      hosts:
        bao-1:
          ansible_host: 192.168.0.41
          openbao_node_id: bao-1
          openbao_keepalived_priority: 120
        bao-2:
          ansible_host: 192.168.0.42
          openbao_node_id: bao-2
          openbao_keepalived_priority: 110
        bao-3:
          ansible_host: 192.168.0.43
          openbao_node_id: bao-3
          openbao_keepalived_priority: 100
      vars:
        ansible_user: openbao-admin
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ openbao_ssh_private_key_file }}"
        # UserKnownHostsFile is not overridden: the controller path contains
        # a space ("Home Lab") and OpenSSH splits that into a hostname. Keys
        # are pinned in the operator known_hosts and mirrored in
        # artifacts/openbao_known_hosts.
        ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o IdentityAgent=none

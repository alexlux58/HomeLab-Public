---
# ===========================================================================
# Static inventory for the three Proxmox VE hosts.
#
# NO CREDENTIALS LIVE HERE. Authentication is public-key only, using the key
# that is already installed on all three hosts. If your key file is named
# something other than ~/.ssh/proxmox_cluster_ed25519, change the single
# variable `ssh_key_name` in inventory/group_vars/all.yml — it is referenced
# from exactly one place and flows into ansible_ssh_private_key_file below.
# ===========================================================================
all:
  children:
    proxmox:
      hosts:
        pve1:
          ansible_host: 192.168.0.11
          expected_hostname: pve1
          preserve_guests: true
          cluster_seed: true
          ssh_alias: pve1
          role_note: "Seed node. In-place PVE 8 -> 9 upgrade. Never clean-installed."
          # Public SSH host-key fingerprint recorded by the operator on
          # 2026-08-21 from the local console. Fingerprints are public data.
          # A mismatch means the host key changed and MUST be re-verified by
          # hand at the console before continuing.
          expected_host_fingerprint: "SHA256:EXAMPLE_FINGERPRINT_REDACTED"

        pve2:
          ansible_host: 192.168.0.12
          expected_hostname: pve2
          preserve_guests: false
          cluster_seed: false
          ssh_alias: pve2
          role_note: "Clean-installed after .11 backups verify. Current guests are cataloged for later rebuild, not restored."
          # Verified at the local console after the PVE 9.2 clean install on
          # 2026-08-23.
          expected_host_fingerprint: "SHA256:EXAMPLE_FINGERPRINT_REDACTED"

        pve:
          ansible_host: 192.168.0.13
          expected_hostname: pve3
          preserve_guests: false
          cluster_seed: false
          ssh_alias: pve3
          role_note: "Clean-installed as pve3 and joined empty. Old guests are cataloged for later rebuild."
          expected_host_fingerprint: "SHA256:EXAMPLE_FINGERPRINT_REDACTED"

      vars:
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ssh_private_key_file }}"
        ansible_python_interpreter: /usr/bin/python3

    # Convenience groups used by --limit and by the playbooks' `hosts:` lines.
    preserve:
      hosts:
        pve1: {}

    disposable:
      hosts:
        pve2: {}
        pve: {}

    seed:
      hosts:
        pve1: {}

---
all:
  children:
    observability_servers:
      hosts:
        observability:
          ansible_host: 192.168.0.31
          ansible_user: labuser
          ansible_ssh_private_key_file: ~/.ssh/homelab_observability_ed25519
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/observability_known_hosts
    docker_hosts:
      hosts:
        homelab-services:
          ansible_host: 192.168.0.30
          ansible_user: labuser
          ansible_ssh_private_key_file: ~/.ssh/homelab_services_ed25519
